<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🎨 Design Dispatch v2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #F0F1F7;
  --surface: #fff;
  --navy: #1a1a2e;
  --navy2: #252540;
  --accent: #4361EE;
  --accent2: #3A0CA3;
  --green: #27AE60;
  --yellow: #D4AC0D;
  --red: #E74C3C;
  --orange: #F9844A;
  --border: #E8E8F0;
  --text: #1a1a2e;
  --text2: #666;
  --text3: #aaa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}

/* ── HEADER ── */
.header{background:var(--navy);padding:0 24px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.logo{padding:14px 0;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.logo-title{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:#6666aa;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase}
.nav{display:flex;gap:2px}
.nav-btn{background:none;color:#6666aa;border:none;border-radius:6px 6px 0 0;padding:12px 14px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;transition:all .15s;letter-spacing:.3px;white-space:nowrap}
.nav-btn.active{background:rgba(255,255,255,.12);color:#fff}
.nav-btn:hover:not(.active){color:#aaaadd}
.hdr-actions{display:flex;gap:6px;padding:6px 0}
.btn{border:none;border-radius:7px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.18)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3251dd}
.btn-danger{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-family:inherit;padding:3px 6px}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}

/* ── FILTER BAR ── */
.filter-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:9px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fg{display:flex;align-items:center;gap:5px}
.fg label{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.3px}
.fg select,.fg input{padding:4px 8px;border-radius:6px;border:1.5px solid var(--border);font-size:12px;color:var(--text);background:#FAFAFA;font-family:inherit}
.filter-count{margin-left:auto;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.btn-clear-filter{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-weight:700;font-family:inherit}

/* ── CONTENT ── */
.content{padding:20px 24px}

/* ── TABLE (LIST) ── */
.table-wrap{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#F5F5FC}
th{padding:9px 12px;text-align:left;font-weight:700;color:var(--text3);font-size:10px;letter-spacing:.6px;border-bottom:1.5px solid var(--border);white-space:nowrap;text-transform:uppercase}
tbody tr{border-bottom:1px solid #F3F3F8;transition:background .1s}
tbody tr:hover{background:#FAFAFE}
td{padding:9px 12px;vertical-align:middle}
.td-actions button{background:none;border:none;cursor:pointer;font-size:12px;font-family:inherit;padding:2px 6px;border-radius:4px}
.btn-edit{color:var(--accent)}
.btn-edit:hover{background:#EEF0FF}
.btn-del{color:var(--red)}
.btn-del:hover{background:#FFF0EE}

/* ── DEADLINE PILL ── */
.deadline{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;font-family:'DM Mono',monospace}
.deadline.ok{background:#EAFAF1;color:var(--green)}
.deadline.warn{background:#FEF9E7;color:var(--yellow)}
.deadline.urgent{background:#FFF0EE;color:var(--red);animation:pulse-bg 1.5s infinite}
.deadline.none{background:#F5F5F5;color:var(--text3)}
@keyframes pulse-bg{0%,100%{opacity:1}50%{opacity:.6}}

/* ── BADGE ── */
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge-market{background:#EEEEFF;color:var(--accent)}
.status-pill{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0}

/* ── KANBAN ── */
.kanban{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.k-col{min-width:250px;flex:1;background:#F5F5FC;border-radius:10px;padding:12px}
.k-col-hdr{display:flex;align-items:center;margin-bottom:10px;gap:6px}
.k-col-title{font-weight:700;font-size:12px}
.k-col-count{margin-left:auto;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:800;font-family:'DM Mono',monospace}
.k-card{background:var(--surface);border-radius:9px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .15s;border-left:3px solid transparent}
.k-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.k-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:4px}
.k-card-name{font-weight:700;color:var(--text);font-size:13px;margin-bottom:3px}
.k-card-meta{font-size:11px;color:var(--text3)}
.k-card-note{font-size:10px;color:var(--text3);margin-top:5px;font-style:italic;line-height:1.4}
.k-card-del{background:none;border:none;cursor:pointer;color:#CCC;font-size:14px;line-height:1;padding:2px;flex-shrink:0}
.k-card-del:hover{color:var(--red)}

/* ── TIMELINE ── */
.timeline{max-width:700px;margin:0 auto}
.tl-row{display:flex;gap:18px;margin-bottom:18px}
.tl-date{text-align:right;min-width:80px;padding-top:3px}
.tl-date-main{font-size:12px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace}
.tl-date-year{font-size:10px;color:var(--text3)}
.tl-body{position:relative;padding-left:18px;flex:1}
.tl-line{position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border)}
.tl-dot{position:absolute;left:-4px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent)}
.tl-cards{display:flex;flex-wrap:wrap;gap:7px}
.tl-card{background:var(--surface);border-radius:9px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.07);min-width:150px}
.tl-card-name{font-weight:700;font-size:12px;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:5px}
.tl-badges{display:flex;gap:3px;flex-wrap:wrap}

/* ── EXCEL VIEW ── */
.excel-wrap{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.excel-table{border-collapse:collapse;font-size:11px;min-width:100%}
.excel-table th,.excel-table td{border:1px solid #E8E8F0;padding:0}
.excel-th-corner{background:#F0F0F8;width:90px;min-width:90px;position:sticky;left:0;z-index:10}
.excel-th-date{background:#F0F0F8;min-width:130px;max-width:160px;text-align:center;padding:6px 8px;font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap;font-family:'DM Mono',monospace}
.excel-th-date.today-col{background:#EEF0FF;color:var(--accent)}
.excel-th-designer{background:#F0F0F8;position:sticky;left:0;z-index:5;padding:7px 10px;font-weight:700;font-size:11px;color:var(--text);min-width:90px;white-space:nowrap;border-right:2px solid #D0D0E8}
.excel-cell{vertical-align:top;padding:4px;min-width:130px;max-width:160px;background:var(--surface);position:relative}
.excel-cell.today-col{background:#FAFAFF}
.excel-chip{border-radius:5px;padding:3px 6px;margin-bottom:3px;cursor:pointer;transition:box-shadow .1s;border-left:3px solid transparent}
.excel-chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.excel-chip-title{font-size:10px;font-weight:700;color:var(--text);line-height:1.3}
.excel-chip-meta{font-size:9px;color:var(--text3);margin-top:1px}
.excel-add-btn{display:block;width:100%;background:none;border:1px dashed #D0D0E0;border-radius:5px;padding:4px;font-size:10px;color:var(--text3);cursor:pointer;font-family:inherit;text-align:center;margin-top:2px}
.excel-add-btn:hover{background:#F5F5FF;color:var(--accent);border-color:var(--accent)}

/* ── STATS ── */
.stats{display:flex;flex-direction:column;gap:20px}
.stat-card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.stat-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px}
.bar-chart{display:flex;gap:5px;align-items:flex-end;height:80px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-val{font-size:9px;color:var(--text3);font-family:'DM Mono',monospace}
.bar-fill{width:100%;border-radius:3px;transition:height .3s}
.bar-lbl{font-size:8px;color:var(--text3)}
.designer-group-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:7px;text-transform:uppercase}
.d-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.d-name{width:65px;font-size:11px;font-weight:600;color:var(--text);text-align:right}
.d-bar-wrap{flex:1;background:#F0F0F0;border-radius:5px;height:10px;overflow:hidden}
.d-bar{background:var(--accent);height:100%;border-radius:5px;transition:width .4s}
.d-count{width:24px;font-size:11px;font-weight:700;color:var(--accent);font-family:'DM Mono',monospace}
.type-grid{display:flex;flex-wrap:wrap;gap:7px}
.type-chip{border-radius:7px;padding:7px 12px;display:flex;align-items:center;gap:7px}
.type-chip-lbl{font-size:11px;font-weight:700}
.type-chip-count{font-size:13px;font-weight:800;color:var(--text)}

/* ── SETTINGS ── */
.settings{display:flex;flex-direction:column;gap:20px;max-width:600px}
.setting-card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.setting-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag-item{display:inline-flex;align-items:center;gap:5px;background:#F0F0F8;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--text)}
.tag-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;line-height:1;padding:0 2px}
.tag-del:hover{color:var(--red)}
.add-tag-row{display:flex;gap:8px}
.add-tag-input{flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;font-family:inherit;outline:none}
.add-tag-input:focus{border-color:var(--accent)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,15,30,.65);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(5px)}
.modal{background:var(--surface);border-radius:16px;padding:28px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 32px 100px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.fg-modal label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.3px}
.fg-modal input,.fg-modal select,.fg-modal textarea{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:border .15s}
.fg-modal input:focus,.fg-modal select:focus,.fg-modal textarea:focus{border-color:var(--accent)}
.fg-modal textarea{resize:vertical;min-height:70px;line-height:1.5}
.modal-btns{display:flex;gap:8px;margin-top:22px;justify-content:flex-end}
.btn-cancel{background:#F0F0F0;color:var(--text);border:none;border-radius:8px;padding:9px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#E5E5E5}
.btn-save{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-save:hover{background:var(--navy2)}

/* ── EMAIL PARSER ── */
.email-section{background:#F8F8FF;border-radius:10px;padding:14px;margin-bottom:14px;border:1.5px solid #E0E0F5}
.email-section label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px}
.email-section textarea{width:100%;padding:8px 10px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;font-family:inherit;resize:vertical;min-height:80px;outline:none}
.btn-parse{margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.parse-status{font-size:11px;color:var(--text3);margin-top:6px;font-style:italic}

/* ── EMPTY ── */
.empty{text-align:center;padding:50px;color:var(--text3);font-size:13px}

/* ── MULTI-SELECT DROPDOWN ── */
.ms-wrap{position:relative}
.ms-trigger{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:border .15s;background:#fff;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:38px}
.ms-trigger:focus,.ms-trigger.open{border-color:var(--accent)}
.ms-trigger-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
.ms-trigger-arrow{color:#aaa;font-size:10px;flex-shrink:0}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--accent);border-radius:10px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.15);max-height:220px;overflow-y:auto;padding:6px}
.ms-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text);transition:background .1s;user-select:none}
.ms-item:hover{background:#F0F0FF}
.ms-item.checked{background:#EEF0FF;color:var(--accent);font-weight:700}
.ms-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.ms-optgroup-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:6px 10px 3px;border-top:1px solid var(--border);margin-top:3px}
.ms-optgroup-label:first-child{border-top:none;margin-top:0}
.ms-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ms-chip{display:inline-flex;align-items:center;gap:4px;background:#EEF0FF;color:var(--accent);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600}
.ms-chip-x{background:none;border:none;cursor:pointer;color:#aaa;font-size:12px;line-height:1;padding:0;margin-left:1px}
.ms-chip-x:hover{color:var(--red)}

/* ── MONTH NAMES ── */
</style>
</head>
<body>
<div id="app"></div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DEFAULT_JOB_TYPES = ["V1","Revision","M1","Revised Maker","KV","Moodboard","Check Info","Pkg Layout"];
const DEFAULT_MARKETS = ["AP","GC","SBJ","SCK","RNA","EMEA","MENA","TW","HK","Other"];
const DEFAULT_DESIGNERS = {
  "2D": ["Faye","Alan","Avis","Carol","Roy","Jou"],
  "插畫": ["Mona","Cathy","Emilia","Echo","Heiwin"],
  "3D": []
};
const DEFAULT_SALES = ["Ann","Ben","Chris","Dana","Eric","Fiona","Other"];
const STATUSES = ["進行中","已完成","擱置"];
const STATUS_STYLE = {
  "進行中": {bg:"#E8F4FD",text:"#2980B9",dot:"#2980B9",border:"#2980B9"},
  "已完成":  {bg:"#EAFAF1",text:"#27AE60",dot:"#27AE60",border:"#27AE60"},
  "擱置":   {bg:"#FEF9E7",text:"#D4AC0D",dot:"#D4AC0D",border:"#D4AC0D"},
};
const TYPE_COLORS = ["#6C63FF","#FF6584","#43BCCD","#F9844A","#4CC9F0","#F72585","#7209B7","#3A0CA3","#4361EE","#4895EF","#E76F51","#2A9D8F"];

function typeColor(t,types){ return TYPE_COLORS[types.indexOf(t) % TYPE_COLORS.length] || "#888"; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ return new Date().toISOString().slice(0,10); }
function allDesigners(dObj){ return Object.values(dObj).flat(); }

// Deadline helpers
function deadlineStatus(dl){
  if(!dl) return "none";
  const diff = Math.ceil((new Date(dl)-new Date(today()))/(1000*60*60*24));
  if(diff<0) return "urgent";   // 逾期
  if(diff<=1) return "warn";    // 今天或明天截止 → 黃色
  return "ok";                  // 其餘 → 綠色
}
function deadlineLabel(dl){
  if(!dl) return "無截止日";
  const diff = Math.ceil((new Date(dl)-new Date(today()))/(1000*60*60*24));
  if(diff<0) return `逾期 ${-diff}天`;
  if(diff===0) return "今天截止";
  if(diff===1) return "明天截止";
  return `剩 ${diff} 天`;
}

// ── STORAGE ────────────────────────────────────────────────────
const KEY_CASES = "dd_cases_v2";
const KEY_SETTINGS = "dd_settings_v2";
const KEY_VACATIONS = "dd_vacations_v2";
const KEY_THUMBS = "dd_thumbs_v2";

function loadCases(){ try{ return JSON.parse(localStorage.getItem(KEY_CASES)||"[]"); }catch{ return []; } }
function saveCases(c){ localStorage.setItem(KEY_CASES,JSON.stringify(c)); }
function loadVacations(){ try{ return JSON.parse(localStorage.getItem(KEY_VACATIONS)||"[]"); }catch{ return []; } }
function saveVacations(v){ localStorage.setItem(KEY_VACATIONS,JSON.stringify(v)); }
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY_SETTINGS)||"{}");
    return {
      jobTypes: s.jobTypes || DEFAULT_JOB_TYPES,
      markets: s.markets || DEFAULT_MARKETS,
      designers: s.designers || DEFAULT_DESIGNERS,
      sales: s.sales || DEFAULT_SALES,
    };
  } catch { return { jobTypes:DEFAULT_JOB_TYPES, markets:DEFAULT_MARKETS, designers:DEFAULT_DESIGNERS, sales:DEFAULT_SALES }; }
}
function saveSettings(s){ localStorage.setItem(KEY_SETTINGS,JSON.stringify(s)); }

// ── THUMBNAIL STORAGE ──────────────────────────────────────────
function loadThumbs(){ try{ return JSON.parse(localStorage.getItem(KEY_THUMBS)||"{}"); }catch{ return {}; } }
function saveThumbs(t){ try{ localStorage.setItem(KEY_THUMBS,JSON.stringify(t)); }catch(e){ alert("圖片儲存空間不足，請刪除舊案件圖片後再試"); } }
function getThumb(id){ return loadThumbs()[id]||null; }
function setThumb(id,dataUrl){ const t=loadThumbs(); t[id]=dataUrl; saveThumbs(t); }
function removeThumb(id){ const t=loadThumbs(); delete t[id]; saveThumbs(t); }

// Auto-cleanup: remove thumbnails for cases whose deadline passed > 14 days ago
function cleanupOldThumbs(){
  const t=loadThumbs();
  const caseMap={};
  S.cases.forEach(c=>caseMap[c.id]=c);
  let changed=false;
  const cutoff=new Date(today()); cutoff.setDate(cutoff.getDate()-14);
  Object.keys(t).forEach(id=>{
    const c=caseMap[id];
    if(!c||(c.deadline&&new Date(c.deadline)<cutoff)){ delete t[id]; changed=true; }
  });
  if(changed) saveThumbs(t);
}

// Compress image to ≤80KB using Canvas
function compressImage(file, cb){
  const MAX=80*1024;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      // Scale down to max 400px wide
      if(w>400){ h=Math.round(h*400/w); w=400; }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      // Try quality from 0.9 down until ≤80KB
      let quality=0.9;
      let dataUrl=canvas.toDataURL("image/jpeg",quality);
      while(dataUrl.length*0.75>MAX && quality>0.1){
        quality=Math.round((quality-0.1)*10)/10;
        dataUrl=canvas.toDataURL("image/jpeg",quality);
      }
      cb(dataUrl);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function getThisWeekRange(){
  const now=new Date(); const day=now.getDay();
  const mon=new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1));
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}
function getNextWeekRange(){
  const [mon]=getThisWeekRange();
  const nm=new Date(mon); nm.setDate(nm.getDate()+7);
  const ns=new Date(nm); ns.setDate(nm.getDate()+6);
  return [nm.toISOString().slice(0,10), ns.toISOString().slice(0,10)];
}
function filterByKanbanWeek(cases){
  if(S.kanbanWeek==="all") return cases;
  const [start,end]=S.kanbanWeek==="this"?getThisWeekRange():getNextWeekRange();
  return cases.filter(c=>c.deadline&&c.deadline>=start&&c.deadline<=end);
}

// ── EXCEL VIEW (Weekly Calendar by Deadline) ───────────────────
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function getWeekDates(offset){
  // Returns Mon-Fri dates for the week with given offset from current week
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day===0?6:day-1) + offset*7);
  const dates=[];
  for(let i=0;i<5;i++){
    const d=new Date(mon);
    d.setDate(mon.getDate()+i);
    dates.push(d.toISOString().slice(0,10));
  }
  return dates;
}

function getWeekLabel(dates){
  // e.g. "5/18 (Mon) – 5/22 (Fri)"
  const fmt=d=>{
    const dt=new Date(d);
    return `${dt.getMonth()+1}/${dt.getDate()} (${DAY_SHORT[dt.getDay()]})`;
  };
  return `${fmt(dates[0])} – ${fmt(dates[4])}`;
}

function getMonthWeeks(year,month){
  // Return all Mon-Fri weeks that overlap with given month
  // Find first Monday of or before first day
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const weeks=[];
  let mon=new Date(first);
  const fd=first.getDay();
  mon.setDate(first.getDate()-(fd===0?6:fd-1));
  while(mon<=last){
    const fri=new Date(mon); fri.setDate(mon.getDate()+4);
    weeks.push({mon:new Date(mon),fri});
    mon.setDate(mon.getDate()+7);
  }
  return weeks;
}

function isDesignerOnVacation(designer,dateStr){
  return S.vacations.some(v=>v.designer===designer&&v.start<=dateStr&&v.end>=dateStr);

// Temporary state for modal multi-selects (lives in S.modal object)
function toggleMsDropdown(id){
  const dd=document.getElementById(`${id}-dd`);
  const btn=document.getElementById(`${id}-btn`);
  if(!dd) return;
  const isOpen=dd.style.display!=="none";
  // Close all first
  document.querySelectorAll(".ms-dropdown").forEach(el=>el.style.display="none");
  document.querySelectorAll(".ms-trigger").forEach(el=>el.classList.remove("open"));
  if(!isOpen){ dd.style.display="block"; btn&&btn.classList.add("open"); }
}
function closeMsDropdownsOnOutside(e){
  if(!e.target.closest(".ms-wrap")){
    document.querySelectorAll(".ms-dropdown").forEach(el=>el.style.display="none");
    document.querySelectorAll(".ms-trigger").forEach(el=>el.classList.remove("open"));
  }
}
function toggleModalDesigner(name,checked){
  if(!S.modal||S.modal==="new") S.modal={_preset:{designers:[],jobTypes:[S.settings.jobTypes[0]||"V1"]}};
  const cur=toArr(S.modal.designers||S.modal._preset?.designers||[]);
  const updated=checked?[...new Set([...cur,name])]:cur.filter(d=>d!==name);
  if(S.modal._preset){ S.modal._preset.designers=updated; }
  else { S.modal.designers=updated; }
  render();
}

  if(!S.modal||S.modal==="new") S.modal={_preset:{jobTypes:[],designers:[]}};

function openThumbUpload(id){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    compressImage(file,dataUrl=>{
      setThumb(id,dataUrl);
      render();
    });
  };
  inp.click();
}


// ── EMAIL PARSER (rule-based) ──────────────────────────────────
function parseEmail(){
  const text=document.getElementById("email-paste")?.value||"";
  S.parseText=text;
  if(!text.trim()){ S.parseStatus="請貼上信件內容"; render(); return; }

  const txt=text.toUpperCase();
  const result={};

  // Market
  for(const m of S.settings.markets){
    if(txt.includes(m.toUpperCase())){ result.market=m; break; }
  }
  // Job type
  for(const j of S.settings.jobTypes){
    if(txt.toUpperCase().includes(j.toUpperCase())){ result.jobType=j; break; }
  }
  // Deadline - look for date patterns YYYY/MM/DD or MM/DD or YYYY-MM-DD
  const dlMatch=text.match(/(?:deadline|截止|due|by|before)[^\d]*(\d{4}[-/]\d{1,2}[-/]\d{1,2})/i)
    || text.match(/(\d{4}[-/]\d{1,2}[-/]\d{1,2})/);
  if(dlMatch){
    result.deadline=dlMatch[1].replace(/\//g,"-");
  }
  // Designer
  for(const d of allDesigners(S.settings.designers)){
    if(text.includes(d)){ result.designer=d; break; }
  }
  // Sales
  for(const s of S.settings.sales){
    if(text.toLowerCase().includes(s.toLowerCase())){ result.sales=s; break; }
  }

  // Apply to form — for multi-select, update S.modal state
  if(result.market){ const el=document.getElementById("f-market"); if(el) el.value=result.market; }
  if(result.jobType){
    if(S.modal&&S.modal._preset){ S.modal._preset.jobTypes=[result.jobType]; }
    else if(S.modal){ S.modal.jobTypes=[result.jobType]; }
  }
  if(result.deadline){ const el=document.getElementById("f-deadline"); if(el) el.value=result.deadline; }
  if(result.designer){
    if(S.modal&&S.modal._preset){ S.modal._preset.designers=[result.designer]; }
    else if(S.modal){ S.modal.designers=[result.designer]; }
  }

  const found=Object.keys(result).length;
  S.parseStatus=found
    ? `✅ 辨識到 ${found} 個欄位：${Object.entries(result).map(([k,v])=>`${k}=${v}`).join("、")}`
    : "⚠️ 未辨識到已知欄位，請手動填寫";
  // Re-render modal area only (keep form state)
  const ps=document.getElementById("parse-status");
  if(ps) ps.textContent=S.parseStatus;
}

// ── VACATION ACTIONS ───────────────────────────────────────────
function openVacationModal(designer){ S.vacationModal={designer}; render(); }
function closeVacationModal(){ S.vacationModal=null; render(); }
function addVacation(designer){
  const start=document.getElementById("vac-start")?.value;
  const end=document.getElementById("vac-end")?.value;
  if(!start||!end){ alert("請選擇開始與結束日期"); return; }
  if(end<start){ alert("結束日期不能早於開始日期"); return; }
  S.vacations=[...S.vacations,{designer,start,end}];
  saveVacations(S.vacations);
  render();
}
function removeVacation(designer,idx){
  const list=S.vacations.filter(v=>v.designer===designer);
  list.splice(idx,1);
  S.vacations=S.vacations.filter(v=>v.designer!==designer).concat(list);
  saveVacations(S.vacations);
  render();
}

// ── QUICK STATUS TOGGLE ────────────────────────────────────────
function quickStatus(id,newStatus){
  S.cases=S.cases.map(c=>c.id===id?{...c,status:newStatus}:c);
  saveCases(S.cases);
  render();
}

// ── SETTINGS ACTIONS ───────────────────────────────────────────
function saveAndRender(){ saveSettings(S.settings); render(); }

function removeMarket(i){ S.settings.markets.splice(i,1); saveAndRender(); }
function addMarket(){ const v=document.getElementById("new-market")?.value.trim(); if(v&&!S.settings.markets.includes(v)){ S.settings.markets.push(v); saveAndRender(); } }

function removeJobType(i){ S.settings.jobTypes.splice(i,1); saveAndRender(); }
function addJobType(){ const v=document.getElementById("new-jobtype")?.value.trim(); if(v&&!S.settings.jobTypes.includes(v)){ S.settings.jobTypes.push(v); saveAndRender(); } }

function removeDesigner(group,i){ S.settings.designers[group].splice(i,1); saveAndRender(); }
function addDesigner(group){ const v=document.getElementById(`new-designer-${group}`)?.value.trim(); if(v&&!S.settings.designers[group].includes(v)){ S.settings.designers[group].push(v); saveAndRender(); } }
function addDesignerGroup(){ const v=document.getElementById("new-designer-group")?.value.trim(); if(v&&!S.settings.designers[v]){ S.settings.designers[v]=[]; saveAndRender(); } }

function removeSales(i){ S.settings.sales.splice(i,1); saveAndRender(); }
function addSales(){ const v=document.getElementById("new-sales")?.value.trim(); if(v&&!S.settings.sales.includes(v)){ S.settings.sales.push(v); saveAndRender(); } }

// ── INIT ───────────────────────────────────────────────────────
cleanupOldThumbs();
render();
</script>
