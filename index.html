<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Design Dispatch Mona</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F0F1F7;
  --surface: #fff;
  --navy: #1a1a2e;
  --navy2: #252540;
  --accent: #4361EE;
  --accent2: #3A0CA3;
  --green: #27AE60;
  --yellow: #D4AC0D;
  --red: #E74C3C;
  --orange: #F9844A;
  --border: #E8E8F0;
  --text: #1a1a2e;
  --text2: #666;
  --text3: #aaa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}

/* ── HEADER ── */
.header{background:#fff;padding:0 24px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--border)}
.logo{padding:14px 0;margin-right:auto;display:flex;align-items:baseline;gap:10px}
.logo-title{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text3);font-family:'Noto Sans TC',sans-serif;letter-spacing:1px;text-transform:uppercase}
.nav{display:flex;gap:2px}
.nav-btn{background:none;color:var(--text2);border:none;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;transition:all .15s;letter-spacing:.3px;white-space:nowrap}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-btn:hover:not(.active){color:var(--text)}
.hdr-actions{display:flex;gap:6px;padding:6px 0}
.btn{border:none;border-radius:7px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:#F5F5F8}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3251dd}
.btn-danger{background:none;border:none;color:var(--red);cursor:pointer;font-size:12px;font-family:inherit;padding:3px 6px}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:6px}

/* ── FILTER BAR ── */
.filter-bar{background:var(--surface);border-bottom:1.5px solid var(--border);padding:9px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fg{display:flex;align-items:center;gap:5px}
.fg label{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.3px}
.fg select,.fg input{padding:4px 8px;border-radius:6px;border:1.5px solid var(--border);font-size:12px;color:var(--text);background:#FAFAFA;font-family:inherit}
.filter-count{margin-left:auto;font-size:11px;color:var(--text3);font-family:'Noto Sans TC',sans-serif}
.btn-clear-filter{background:none;border:none;color:var(--red);font-size:11px;cursor:pointer;font-weight:700;font-family:inherit}

/* ── CONTENT ── */
.content{padding:20px 24px}

/* ── TABLE (LIST) ── */
.table-wrap{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:#F5F5FC}
th{padding:9px 12px;text-align:left;font-weight:700;color:var(--text3);font-size:10px;letter-spacing:.6px;border-bottom:1.5px solid var(--border);white-space:nowrap;text-transform:uppercase}
tbody tr{border-bottom:1px solid #F3F3F8;transition:background .1s}
tbody tr:hover{background:#FAFAFE}
td{padding:9px 12px;vertical-align:middle}
.td-actions button{background:none;border:none;cursor:pointer;font-size:12px;font-family:inherit;padding:2px 6px;border-radius:4px}
.btn-edit{color:var(--accent)}
.btn-edit:hover{background:#EEF0FF}
.btn-del{color:var(--red)}
.btn-del:hover{background:#FFF0EE}

/* ── DEADLINE PILL ── */
.deadline{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;font-family:'Noto Sans TC',sans-serif}
.deadline.ok{color:var(--green)}
.deadline.warn{color:var(--yellow)}
.deadline.urgent{color:var(--red)}
.deadline.none{color:var(--text3)}

/* ── BADGE ── */
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.badge-market{background:#EEEEFF;color:var(--accent)}
.status-pill{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;flex-shrink:0}

/* ── KANBAN / REVIEW ── */
.kanban{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
.k-col{min-width:260px;flex:1;background:#F5F5FC;border-radius:10px;padding:12px}
.k-col-hdr{display:flex;align-items:center;margin-bottom:10px;gap:6px}
.k-col-title{font-weight:700;font-size:12px}
.k-col-count{margin-left:auto;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:800;font-family:'Noto Sans TC',sans-serif}
.k-card{background:var(--surface);border-radius:9px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .15s;border-left:3px solid transparent}
.k-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.k-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;gap:4px}
.k-card-name{font-weight:700;color:var(--text);font-size:13px;margin-bottom:3px}
.k-card-meta{font-size:11px;color:var(--text3)}
.k-card-note{font-size:10px;color:var(--text3);margin-top:5px;font-style:italic;line-height:1.4}
.k-card-del{background:none;border:none;cursor:pointer;color:#CCC;font-size:14px;line-height:1;padding:2px;flex-shrink:0}
.k-card-del:hover{color:var(--red)}
/* Review icons */
.review-badge{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:700}
.review-good{background:#EAFAF1;color:#27AE60}
.review-chaos{background:#FEF9E7;color:#D4AC0D}
.review-check{background:#FFF0EE;color:#E74C3C}

/* ── EXCEL VIEW ── */
.excel-wrap{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.excel-table{border-collapse:collapse;font-size:11px;min-width:100%}
.excel-table th,.excel-table td{border:1px solid #E8E8F0;padding:0}
.excel-th-corner{background:#F0F0F8;width:90px;min-width:90px;position:sticky;left:0;z-index:20}
.excel-th-date{background:#F0F0F8;min-width:0;width:calc((100% - 90px)/5);text-align:center;padding:6px 8px;font-size:10px;font-weight:700;color:var(--text2);white-space:nowrap;font-family:'Noto Sans TC',sans-serif;position:sticky;top:0;z-index:10}
.excel-th-date.today-col{background:#EEF0FF;color:var(--accent)}
.excel-th-designer{background:#F0F0F8;position:sticky;left:0;z-index:5;padding:7px 10px;font-weight:700;font-size:11px;color:var(--text);min-width:90px;white-space:nowrap;border-right:2px solid #D0D0E8}
.excel-cell{vertical-align:top;padding:4px;width:calc((100% - 90px)/5);background:var(--surface);position:relative}
.excel-cell.today-col{background:var(--surface)}
.excel-chip{border-radius:5px;padding:3px 6px;margin-bottom:3px;cursor:pointer;transition:box-shadow .1s;border-left:3px solid transparent}
.excel-chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.excel-chip-title{font-size:10px;font-weight:700;color:var(--text);line-height:1.3}
.excel-chip-meta{font-size:9px;color:var(--text3);margin-top:1px}
.excel-add-btn{display:none;width:100%;background:none;border:none;border-radius:5px;padding:4px;font-size:10px;color:var(--text3);cursor:pointer;font-family:inherit;text-align:center;margin-top:2px}
.excel-cell:hover .excel-add-btn{display:block}
.excel-add-btn:hover{background:#F5F5FF;color:var(--accent)}

/* ── STATS ── */
.stats{display:flex;flex-direction:column;gap:20px}
.stat-card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.stat-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px}
.bar-chart{display:flex;gap:5px;align-items:flex-end;height:80px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-val{font-size:9px;color:var(--text3);font-family:'Noto Sans TC',sans-serif}
.bar-fill{width:100%;border-radius:3px;transition:height .3s}
.bar-lbl{font-size:8px;color:var(--text3)}
.designer-group-lbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:7px;text-transform:uppercase}
.d-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.d-name{width:65px;font-size:11px;font-weight:600;color:var(--text);text-align:right}
.d-bar-wrap{flex:1;background:#F0F0F0;border-radius:5px;height:10px;overflow:hidden}
.d-bar{background:var(--accent);opacity:0.6;height:100%;border-radius:5px;transition:width .4s}
.d-count{width:24px;font-size:11px;font-weight:700;color:var(--accent);font-family:'Noto Sans TC',sans-serif}
.type-grid{display:flex;flex-direction:column;gap:6px}
.type-chip{border-radius:6px;padding:5px 10px;display:flex;align-items:center;gap:8px;min-width:60px;transition:width .4s}
.type-chip-lbl{font-size:11px;font-weight:700;white-space:nowrap}
.type-chip-count{font-size:12px;font-weight:800;white-space:nowrap}

/* ── SETTINGS ── */
.settings{display:flex;flex-direction:column;gap:20px;max-width:600px}
.setting-card{background:var(--surface);border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.setting-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tag-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tag-item{display:inline-flex;align-items:center;gap:5px;background:#F0F0F8;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--text)}
.tag-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;line-height:1;padding:0 2px}
.tag-del:hover{color:var(--red)}
.add-tag-row{display:flex;gap:8px}
.add-tag-input{flex:1;padding:7px 10px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;font-family:inherit;outline:none}
.add-tag-input:focus{border-color:var(--accent)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,15,30,.65);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(5px)}
.modal{background:var(--surface);border-radius:16px;padding:28px;width:520px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 32px 100px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.fg-modal label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.3px}
.fg-modal input,.fg-modal select,.fg-modal textarea{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:border .15s}
.fg-modal input:focus,.fg-modal select:focus,.fg-modal textarea:focus{border-color:var(--accent)}
.fg-modal textarea{resize:vertical;min-height:70px;line-height:1.5}
.modal-btns{display:flex;gap:8px;margin-top:22px;justify-content:flex-end}
.btn-cancel{background:#F0F0F0;color:var(--text);border:none;border-radius:8px;padding:9px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:#E5E5E5}
.btn-save{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-save:hover{background:var(--navy2)}

/* ── EMAIL PARSER ── */
.email-section{background:#F8F8FF;border-radius:10px;padding:14px;margin-bottom:14px;border:1.5px solid #E0E0F5}
.email-section label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px}
.email-section textarea{width:100%;padding:8px 10px;border-radius:7px;border:1.5px solid var(--border);font-size:12px;font-family:inherit;resize:vertical;min-height:80px;outline:none}
.btn-parse{margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.parse-status{font-size:11px;color:var(--text3);margin-top:6px;font-style:italic}

/* ── EMPTY ── */
.empty{text-align:center;padding:50px;color:var(--text3);font-size:13px}

/* ── MULTI-SELECT DROPDOWN ── */
.ms-wrap{position:relative}
.ms-trigger{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:border .15s;background:#fff;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:38px}
.ms-trigger:focus,.ms-trigger.open{border-color:var(--accent)}
.ms-trigger-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}
.ms-trigger-arrow{color:#aaa;font-size:10px;flex-shrink:0}
.ms-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--accent);border-radius:10px;z-index:500;box-shadow:0 8px 32px rgba(0,0,0,.15);max-height:220px;overflow-y:auto;padding:6px}
.ms-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text);transition:background .1s;user-select:none}
.ms-item:hover{background:#F0F0FF}
.ms-item.checked{background:#EEF0FF;color:var(--accent);font-weight:700}
.ms-item input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.ms-optgroup-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;padding:6px 10px 3px;border-top:1px solid var(--border);margin-top:3px}
.ms-optgroup-label:first-child{border-top:none;margin-top:0}
.ms-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ms-chip{display:inline-flex;align-items:center;gap:4px;background:#EEF0FF;color:var(--accent);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600}
.ms-chip-x{background:none;border:none;cursor:pointer;color:#aaa;font-size:12px;line-height:1;padding:0;margin-left:1px}
.ms-chip-x:hover{color:var(--red)}

/* ── MONTH NAMES ── */
</style>
</head>

<script>
// ── SUPABASE ───────────────────────────────────────────────────
const SUPA_URL = "https://lczpbtkoxsvlsucbqoxp.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjenBidGtveHN2bHN1Y2Jxb3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDgzNzUsImV4cCI6MjA5NDY4NDM3NX0.KtA-AwVW2ecHajexiKsiM-ZKLgG3wC8pcpq4vPp3SHw";
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── CONSTANTS ──────────────────────────────────────────────────
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DEFAULT_JOB_TYPES = ["Moodboard","KV","V1","Revision","M1","Revised Maker","Care Card","JPG","Note"];

};
const TYPE_COLORS = ["#6C63FF","#FF6584","#43BCCD","#F9844A","#4CC9F0","#F72585","#7209B7","#3A0CA3","#4361EE","#4895EF","#E76F51","#2A9D8F"];
function normalizeType(t){ return t==='Presentation'?'V1':t; }
const TYPE_COLOR_MAP = {
  "V1":           "#666666",
  "Revision":     "#666666",
  "Presentation": "#666666",
  "M1":           "#2A9D8F",
  "Revised Maker":"#2A9D8F",
  "KV":           "#FF6584",
  "Moodboard":    "#FF6584",
  "Care Card":    "#43BCCD",
  "JPG":          "#4361EE",
  "Note":         "#E76F51",
};

function typeColor(t,types){ return TYPE_COLOR_MAP[t] || TYPE_COLORS[types ? types.indexOf(t) % TYPE_COLORS.length : 0] || "#888"; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today(){ return localDateStr(new Date()); }
const DESIGNER_GROUP_ORDER = ["2D","插畫","3D"];
function allDesigners(dObj){
  const ordered = DESIGNER_GROUP_ORDER.filter(g=>dObj[g]).flatMap(g=>dObj[g]||[]);
  const others  = Object.entries(dObj).filter(([g])=>!DESIGNER_GROUP_ORDER.includes(g)).flatMap(([,v])=>v||[]);
  return [...ordered,...others];
}

// Deadline helpers
function deadlineStatus(dl){
  if(!dl) return "none";
  const diff = Math.ceil((new Date(dl)-new Date(today()))/(1000*60*60*24));
  if(diff<0) return "urgent";   // 逾期
  if(diff===0) return "warn";   // 今天截止 → 黃色
  return "ok";                  // 其餘 → 綠色
}
function deadlineLabel(dl){
  if(!dl) return "無截止日";
  const diff = Math.ceil((new Date(dl)-new Date(today()))/(1000*60*60*24));
  if(diff<0) return `逾期 ${-diff}天`;
  if(diff===0) return "今天截止";
  if(diff===1) return "明天截止";
  return `剩 ${diff} 天`;
}

// ── STORAGE ────────────────────────────────────────────────────
const KEY_CASES = "dd_cases_v2";
const KEY_SETTINGS = "dd_settings_v2";
const KEY_VACATIONS = "dd_vacations_v2";
const KEY_THUMBS = "dd_thumbs_v2";
const KEY_FREEROWS = "dd_freerows_v2";

// ── SUPABASE DATA LAYER ────────────────────────────────────────
// 所有讀寫都是 async，透過 initApp() 統一載入

// Cases
async function loadCases(){
  const {data,error}=await db.from("cases").select("*").order("created_at",{ascending:false});
  if(error){ console.error("loadCases",error); return []; }
  return (data||[]).map(dbToCase);
}
async function saveCase_db(c, syncToNotion=true){
  const row=caseToDb(c);
  const {error}=await db.from("cases").upsert(row,{onConflict:"id"});
  if(error) console.error("saveCase_db",error);
  if(c.notionProject && syncToNotion){
    fetch("https://lczpbtkoxsvlsucbqoxp.supabase.co/functions/v1/sync-to-notion",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjenBidGtveHN2bHN1Y2Jxb3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDgzNzUsImV4cCI6MjA5NDY4NDM3NX0.KtA-AwVW2ecHajexiKsiM-ZKLgG3wC8pcpq4vPp3SHw"},

async function loadSettings(){
  const {data,error}=await db.from("settings").select("*");
  if(error){ console.error("loadSettings",error); }
  const map={};
  (data||[]).forEach(r=>{ map[r.key]=r.value; });
  // Migrate lowercase 'care card' → 'Care Card' in saved settings
  let jobTypes = (map.jobTypes || DEFAULT_JOB_TYPES).map(t => t === 'care card' ? 'Care Card' : t).filter(t => t !== 'Presentation');
  // Ensure new default job types are added to existing lists without removing custom entries
  DEFAULT_JOB_TYPES.forEach(t=>{ if(!jobTypes.includes(t)) jobTypes.push(t); });
  let sales = map.sales || DEFAULT_SALES;
  DEFAULT_SALES.forEach(s=>{ if(!sales.includes(s)) sales.push(s); });
  // Enforce DEFAULT_MARKETS order (add any custom markets at the end)
  const savedMarkets = map.markets || DEFAULT_MARKETS;
  const orderedMarkets = [...DEFAULT_MARKETS];
  savedMarkets.forEach(m=>{ if(!orderedMarkets.includes(m)) orderedMarkets.push(m); });
  return {
    jobTypes,
    markets: orderedMarkets,
    designers:map.designers|| DEFAULT_DESIGNERS,
    sales,
  };
}

// Compress image to ≤80KB using Canvas
function compressImage(file, cb){
  const MAX=80*1024;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      // Scale down to max 400px wide
      if(w>400){ h=Math.round(h*400/w); w=400; }
      const canvas=document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      // Try quality from 0.9 down until ≤80KB
      let quality=0.9;
      let dataUrl=canvas.toDataURL("image/jpeg",quality);
      while(dataUrl.length*0.75>MAX && quality>0.1){
        quality=Math.round((quality-0.1)*10)/10;
        dataUrl=canvas.toDataURL("image/jpeg",quality);
      }
      cb(dataUrl);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function doExportExcel(){

  const start=startEl.value;

  if(end<start){ alert("結束日期不能早於開始日期"); return; }

  // Build date list (all days Mon–Sun within range)
  const dates=[];
  const cur=new Date(start);
  const endDate=new Date(end);
  while(cur<=endDate){
    dates.push(cur.toISOString().slice(0,10));

// ── LIST VIEW ──────────────────────────────────────────────────
function renderList(cases){
  const types=S.settings.jobTypes;
  const todayStr=today();
  const sevenDaysAgo=new Date(todayStr); sevenDaysAgo.setDate(sevenDaysAgo.getDate()-7);
  const sevenDaysAgoStr=sevenDaysAgo.toISOString().slice(0,10);

  // Filter: hide completed cases
  const filtered=cases.filter(c=>{
    if(S.hideCompleted && c.status==="已完成") return false;
    if(!c.deadline) return true;
    if(c.deadline>=sevenDaysAgoStr) return true;
    return c.status!=="已完成";
  });

  // Sort:未完成 first (deadline asc, no deadline last, then market asc), 已完成 after (same sub-sort)
  function sortKey(a,b){
    if(!a.deadline&&!b.deadline) return a.market.localeCompare(b.market);
    if(!a.deadline) return 1;
    if(!b.deadline) return -1;
    const dl=a.deadline.localeCompare(b.deadline);
    if(dl!==0) return dl;
    return a.market.localeCompare(b.market);
  }
  const undone=filtered.filter(c=>c.status!=="已完成").sort(sortKey);
  const done=filtered.filter(c=>c.status==="已完成").sort(sortKey);
  const sorted=[...undone,...done];

  const rows = sorted.length===0
    ? `<tr><td colspan="9" class="empty">尚無派案記錄 — 點右上角「+ New Case」開始</td></tr>`
    : sorted.map(c=>{
      const isDone=c.status==="已完成";

// ── EXCEL VIEW (Weekly Calendar by Deadline) ───────────────────
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function getWeekDates(offset, span){
  // Returns Mon-Fri dates for 1 or 2 weeks starting from the week at offset
  span = span || 1;
  const now = new Date();
  const day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day===0?6:day-1) + offset*7);
  const dates=[];
  for(let w=0;w<span;w++){
    for(let i=0;i<5;i++){
      const d=new Date(mon);
      d.setDate(mon.getDate()+w*7+i);
      dates.push(localDateStr(d));
    }
  }
  return dates;
}

function getWeekLabel(dates){
  // e.g. "5/18 (Mon) – 5/22 (Fri)"
  const fmt=d=>{
    const dt=new Date(d);
    return `${dt.getMonth()+1}/${dt.getDate()} (${DAY_SHORT[dt.getDay()]})`;
  };
  return `${fmt(dates[0])} – ${fmt(dates[4])}`;
}

function getMonthWeeks(year,month){
  // Return all Mon-Fri weeks that overlap with given month
  // Find first Monday of or before first day
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const weeks=[];
  let mon=new Date(first);
  const fd=first.getDay();
  mon.setDate(first.getDate()-(fd===0?6:fd-1));
  while(mon<=last){
    const fri=new Date(mon); fri.setDate(mon.getDate()+4);
    weeks.push({mon:new Date(mon),fri});
    mon.setDate(mon.getDate()+7);
  }
  return weeks;
}

function isDesignerOnVacation(designer,dateStr){
  // 只有特休才阻擋派案顯示
  return S.vacations.some(v=>v.designer===designer&&v.start<=dateStr&&v.end>=dateStr&&(v.vacType||"特休")==="特休");
}
function isDesignerHasAnyVacation(designer,dateStr){
  // 任何假別都顯示標記（用於總覽表非特休小標示）
  return S.vacations.filter(v=>v.designer===designer&&v.start<=dateStr&&v.end>=dateStr);
}

  const nowDay=nowDate.getDay();

    else thStyle="background:#F0F0F8;color:var(--text2)";
    return `<th class="excel-th-date" style="${thStyle}">${label}</th>`;

  const dayCounts={};

    if(c.deadline){
      // Get per-designer status to check if done
      toArr(c.designers).forEach(d=>{
        const dStatus=(c.designerStatus&&c.designerStatus[d])||c.status;
        if(dStatus==="已完成") return; // 已完成不計入警示
        const k=`${d}|${c.deadline}`;
        dayCounts[k]=(dayCounts[k]||0)+1;
      });
    }
  });

  const rows=designers.map(designer=>{
    // Workload: warn if any single day this week has >3 cases
    const maxDayCount=dates.reduce((max,d)=>{
      return Math.max(max, dayCounts[`${designer}|${d}`]||0);
    },0);

    const designerCellStyle=maxDayCount>3?"background:#FFF3E0;color:#E65100":"";
    const overloadBadge=maxDayCount>3?` <span style="background:#FF9800;color:#fff;border-radius:8px;padding:1px 5px;font-size:9px;font-weight:700">⚠️${maxDayCount}</span>`:"";

    const cells=dates.map(date=>{

          <div style="text-align:center;padding:8px 4px;color:#1976D2;font-size:11px;font-weight:700">特休</div>

      }

      const otherVacBadge=otherVacs.length

        const displayTypes=toArr(c.jobTypes).map(normalizeType).join("/");
        const mainText=c.note||(displayTypes+` · ${c.market}`);
        // Sub line

    }).join("");

    return `<tr>

        </div>
      </td>${cells}
    </tr>`;
  }).join("");

  // Week navigation arrows
  const prevWeek=`<button onclick="S.excelWeekOffset=${offset-1};render()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">‹</button>`;
  const nextWeek=`<button onclick="S.excelWeekOffset=${offset+1};render()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px">›</button>`;
  const todayBtn=offset!==0?`<button onclick="S.excelWeekOffset=0;render()" style="background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;font-family:inherit;color:var(--accent)">本週</button>`:"";

  // 1週/2週 span toggle
  const spanTabs=[1,2].map(s=>{

  }).join("");

  const rangeLabel=span===1

  const nav=`<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap">

// ── STATS VIEW ─────────────────────────────────────────────────
function renderStats(){
  const year=new Date().getFullYear();
  const todayStr=today();
  const types=S.settings.jobTypes;
  const designers=allDesigners(S.settings.designers);
  const EXCLUDED_FROM_DESIGNER_STATS=["Note"];

  // Time range logic
  const isCustom=S.statsTimeRange==="custom";
  const statsStart=isCustom&&S.statsStart?S.statsStart:`${year}-01-01`;
  const statsEnd=isCustom&&S.statsEnd?S.statsEnd:`${year}-12-31`;

  const rangeLabel = isCustom&&S.statsStart&&S.statsEnd
    ? `${S.statsStart} ～ ${S.statsEnd}`
    : `${year} 年全年`;

  const allCases=S.cases.filter(c=>c.date>=statsStart&&c.date<=statsEnd);
  const yearlyForStats=allCases.filter(c=>c.status!=="擱置");

  const byD={}; designers.forEach(d=>byD[d]=0);
  yearlyForStats.forEach(c=>{
    const countableTypes=toArr(c.jobTypes).filter(t=>!EXCLUDED_FROM_DESIGNER_STATS.includes(t));
    if(countableTypes.length===0) return;
    toArr(c.designers).forEach(d=>{ if(byD[d]!==undefined) byD[d]++; });
  });

  const byT={}; types.forEach(t=>byT[t]=0);
  yearlyForStats.forEach(c=>{ toArr(c.jobTypes).forEach(j=>{ const nj=normalizeType(j); if(byT[nj]!==undefined) byT[nj]++; }); });

  const byM=Array(12).fill(0);
  yearlyForStats.forEach(c=>{byM[parseInt(c.date.slice(5,7))-1]++;});
  const maxM=Math.max(...byM,1);
  const maxD=Math.max(...Object.values(byD),1);

  // Vacation stats per designer for the time range
  const VAC_TYPES=["特休","病假","其他"];
  const VAC_COLORS={"特休":"#4361EE","病假":"#F9844A","其他":"#43BCCD"};
  // compute vacation days per designer per type within range
  const vacByDesigner={};
  designers.forEach(d=>{ vacByDesigner[d]={"特休":0,"病假":0,"其他":0}; });
  S.vacations.forEach(v=>{
    if(!vacByDesigner[v.designer]) return;
    // Count overlap days between vacation [start,end] and [statsStart,statsEnd]
    const vs=v.start>statsStart?v.start:statsStart;
    const ve=v.end<statsEnd?v.end:statsEnd;
    if(ve<vs) return;
    let days=0;
    if(v.hours){
      days=parseFloat(v.hours)/8; // convert hours to days
    } else {
      const msPerDay=1000*60*60*24;
      days=Math.ceil((new Date(ve)-new Date(vs))/msPerDay)+1;
    }
    const vt=v.vacType||"特休";
    if(vacByDesigner[v.designer][vt]!==undefined){
      vacByDesigner[v.designer][vt]+=days;
    }
  });
  const maxVac=Math.max(...designers.map(d=>VAC_TYPES.reduce((s,t)=>s+(vacByDesigner[d][t]||0),0)),1);
  const hasVac=designers.some(d=>VAC_TYPES.some(t=>(vacByDesigner[d][t]||0)>0));

  // Time range selector
  const rangeSelector=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:#F8F8FF;border-radius:10px;border:1.5px solid #E0E0F5">
    <span style="font-size:11px;font-weight:700;color:#888">統計範圍：</span>
    <button onclick="S.statsTimeRange='all';render()" style="padding:5px 14px;border:none;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:${!isCustom?"var(--accent)":"#F0F0F8"};color:${!isCustom?"#fff":"var(--text2)"}">全部（${year}年）</button>
    <button onclick="S.statsTimeRange='custom';render()" style="padding:5px 14px;border:none;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:${isCustom?"var(--accent)":"#F0F0F8"};color:${isCustom?"#fff":"var(--text2)"}">自訂區間</button>
    ${isCustom?`
    <input type="date" value="${S.statsStart}" onchange="S.statsStart=this.value;render()" style="padding:4px 8px;border-radius:6px;border:1.5px solid #ddd;font-size:12px;font-family:inherit"/>
    <span style="font-size:11px;color:#888">～</span>
    <input type="date" value="${S.statsEnd}" onchange="S.statsEnd=this.value;render()" style="padding:4px 8px;border-radius:6px;border:1.5px solid #ddd;font-size:12px;font-family:inherit"/>
    `:""}
    <span style="font-size:11px;color:var(--accent);font-weight:600;margin-left:4px">📊 ${rangeLabel}</span>
  </div>`;

  const monthBars=byM.map((v,i)=>`
    <div class="bar-col">
      <span class="bar-val">${v||""}</span>
      <div class="bar-fill" style="background:${v?"var(--accent)":"#F0F0F0"};height:${Math.max(3,v/maxM*55)}px"></div>
      <span class="bar-lbl">${MONTH_NAMES[i]}</span>
    </div>`).join("");

  // 建立每位設計師 × 案件種類的計數
  const byDT={};
  designers.forEach(d=>{ byDT[d]={}; types.forEach(t=>byDT[d][t]=0); });
  yearlyForStats.forEach(c=>{
    const countableTypes=toArr(c.jobTypes).filter(t=>!EXCLUDED_FROM_DESIGNER_STATS.includes(t));
    if(countableTypes.length===0) return;
    toArr(c.designers).forEach(d=>{
      if(byDT[d]===undefined) return;
      countableTypes.forEach(t=>{ const nt=normalizeType(t); if(byDT[d][nt]!==undefined) byDT[d][nt]++; });
    });
  });

  const dRows=Object.entries(S.settings.designers).map(([group,list])=>list.length?`
    <div style="margin-bottom:12px">
      <div class="designer-group-lbl">${group}</div>
      ${list.map(d=>{
        const total=byD[d]||0;
        const segments=types
          .filter(t=>byDT[d][t]>0&&!EXCLUDED_FROM_DESIGNER_STATS.includes(t))
          .map(t=>{
            const pct=byDT[d][t]/Math.max(total,1)*100;
            const col=typeColor(t,types);
            return `<div title="${t}: ${byDT[d][t]}" style="height:100%;width:${pct}%;background:${col};opacity:0.6;flex-shrink:0"></div>`;
          }).join("");
        const barWidth=total>0?`${Math.max(4,total/maxD*100)}%`:"4px";
        const segBar=total>0
          ? `<div style="display:flex;height:10px;border-radius:5px;overflow:hidden;width:${barWidth}">${segments}</div><div style="flex:1"></div>`
          : `<div style="flex:1;background:#F0F0F0;height:10px;border-radius:5px;width:4px"></div>`;
        return `<div class="d-row">
          <div class="d-name">${d}</div>
          ${segBar}
          <div class="d-count">${total}</div>
        </div>`;
      }).join("")}
    </div>`:"").join("");

  const sortedTypes=Object.entries(byT).filter(([,v])=>v>0).sort((a,b)=>{
    const ai=DEFAULT_JOB_TYPES.indexOf(a[0]); const bi=DEFAULT_JOB_TYPES.indexOf(b[0]);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });
  const maxT=Math.max(...sortedTypes.map(([,v])=>v),1);
  const typeChips=sortedTypes.map(([t,v])=>{
    const pct=Math.max(8, Math.round(v/maxT*100));
    const col=typeColor(t,types);
    return `<div style="display:flex;align-items:center;gap:8px">
      <div style="width:90px;text-align:right;font-size:11px;font-weight:700;color:${col};flex-shrink:0">${t}</div>
      <div class="type-chip" style="background:${col};opacity:0.65;width:${pct}%;min-width:40px">
        <span class="type-chip-count" style="color:#fff">${v}</span>
      </div>
    </div>`;
  }).join("")||`<span style="color:#bbb;font-size:12px">尚無資料</span>`;

  // Vacation stats bar chart
  const vacLegend=VAC_TYPES.map(t=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#555"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${VAC_COLORS[t]}"></span>${t}</span>`).join("");
  const vacRows=designers.map(d=>{
    const totals=VAC_TYPES.map(t=>vacByDesigner[d][t]||0);
    const total=totals.reduce((a,b)=>a+b,0);
    if(total===0) return "";
    const segments=VAC_TYPES.map((t,i)=>{
      const pct=totals[i]/maxVac*100;
      if(!totals[i]) return "";
      return `<div title="${t}: ${totals[i]%1===0?totals[i]:totals[i].toFixed(1)}天" style="height:100%;width:${pct}%;background:${VAC_COLORS[t]};opacity:0.65;flex-shrink:0;transition:width .4s"></div>`;
    }).join("");
    const totalLabel=totals.map((v,i)=>v>0?`${VAC_TYPES[i]}:${v%1===0?v:v.toFixed(1)}d`:"").filter(Boolean).join(" ");
    return `<div class="d-row">
      <div class="d-name">${d}</div>
      <div style="flex:1;background:#F0F0F0;border-radius:5px;height:10px;overflow:hidden;display:flex">${segments}</div>
      <div style="min-width:90px;font-size:10px;color:#888;margin-left:6px">${totalLabel}</div>
    </div>`;
  }).filter(Boolean).join("");

  const vacBlock=`<div class="stat-card">
    <div class="stat-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>🏖 設計師休假統計</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${vacLegend}</div>
    </div>
    ${hasVac?vacRows:`<div style="color:#bbb;font-size:12px;text-align:center;padding:12px">此期間尚無休假記錄</div>`}
  </div>`;

  return `<div class="stats">
    ${rangeSelector}
    <div class="stat-card"><div class="stat-title">📅 月份派案量（${rangeLabel}）</div><div class="bar-chart">${monthBars}</div></div>
    <div class="stat-card"><div class="stat-title">👤 設計師派案量（${rangeLabel}）</div>${dRows}</div>
    ${vacBlock}
    <div class="stat-card"><div class="stat-title">📋 案件種類分佈（${rangeLabel}）</div><div class="type-grid">${typeChips}</div></div>
  </div>`;
}

// ── REVIEW VIEW ────────────────────────────────────────────────
const REVIEW_COLS=[
  {val:"良好",icon:"",bg:"#EAFAF1",border:"#27AE60",text:"#27AE60"},
  {val:"混亂",icon:"",bg:"#FEF9E7",border:"#D4AC0D",text:"#D4AC0D"},
  {val:"檢討",icon:"",bg:"#FFF0EE",border:"#E74C3C",text:"#E74C3C"},
];
function renderReview(){
  const f=S.reviewFilter;
  const types=S.settings.jobTypes;
  const markets=S.settings.markets;
  const designers=allDesigners(S.settings.designers);

  // Filter bar
  function sel(key,opts,label){
    return `<div class="fg"><label>${label}</label><select onchange="S.reviewFilter['${key}']=this.value;render()">
      <option value="">All</option>
      ${opts.map(o=>`<option${o===f[key]?" selected":""}>${o}</option>`).join("")}
    </select></div>`;
  }
  const filterBar=`<div class="filter-bar" style="margin-bottom:14px">
    ${sel("market",markets,"Market")}
    ${sel("designer",designers,"Designer")}
    ${sel("jobType",types,"Type")}
    ${(f.market||f.designer||f.jobType)?`<button class="btn-clear-filter" onclick="S.reviewFilter={market:'',designer:'',jobType:''};render()">✕ Clear</button>`:""}
  </div>`;

  const reviewedCases=S.cases.filter(c=>{
    if(!c.review) return false;
    if(f.market&&c.market!==f.market) return false;
    if(f.designer&&!toArr(c.designers).includes(f.designer)) return false;
    if(f.jobType&&!toArr(c.jobTypes).includes(f.jobType)) return false;
    return true;
  });

  const cols=REVIEW_COLS.map(col=>{
    const colCases=reviewedCases.filter(c=>c.review===col.val);
    const cards=colCases.map(c=>`
      <div class="k-card" style="border-left-color:${col.border}" onclick="openEdit('${c.id}')">
        ${c.notionProject?`<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3">${c.notionProject}</div>`:""}
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px">${toArr(c.jobTypes).map(j=>`<span style="display:inline-block;background:${typeColor(j,types)}22;color:${typeColor(j,types)};border-radius:5px;padding:3px 8px;font-size:13px;font-weight:700;letter-spacing:.2px">${j}</span>`).join("")}</div>
        <div class="k-card-top">
          <div class="k-card-name">${arrLabel(c.designers)}</div>
          <span class="review-badge review-${col.val==="良好"?"good":col.val==="混亂"?"chaos":"check"}">${col.val}</span>
        </div>
        <div class="k-card-meta">${c.market}${c.sales?" · "+c.sales:""} · ${c.date}</div>
        ${c.note?`<div class="k-card-note">${c.note}</div>`:""}
      </div>`).join("");
    return `<div class="k-col">
      <div class="k-col-hdr">
        <span class="k-col-title" style="color:${col.text}">${col.val}</span>
        <span class="k-col-count" style="background:${col.bg};color:${col.text}">${colCases.length}</span>
      </div>
      ${cards||`<div style="text-align:center;padding:20px;color:#ccc;font-size:12px">無案件</div>`}
    </div>`;
  }).join("");

  const totalReviewed=reviewedCases.length;
  return `<div>
    ${filterBar}
    ${totalReviewed===0&&!f.market&&!f.designer&&!f.jobType
      ?`<div class="empty" style="padding:60px">尚無回顧記錄 — 在編輯案件中標記「回顧」後會顯示在此</div>`
      :`<div class="kanban">${cols}</div>`}
  </div>`;
}

// ── MODAL ──────────────────────────────────────────────────────
function renderModal(){
  if(!S.modal) return "";
  const isNew=S.modal==="new"||S.modal._preset;
  const c=isNew
    ? { id:"",date:today(),deadline:"",market:S.settings.markets[0]||"TW",jobTypes:S.modal._preset?.jobTypes||[S.settings.jobTypes[0]||"V1"],designers:(S.modal._preset?.designers||[S.modal._preset?.designer||allDesigners(S.settings.designers)[0]||""].filter(Boolean)),sales:"",status:"進行中",note:"",emailLink:"", ...(S.modal._preset||{}), deadline: S.modal._preset?.deadline||"" }
    : {...S.modal, designers:toArr(S.modal.designers||S.modal.designer), jobTypes:toArr(S.modal.jobTypes||S.modal.jobType)};

  const types=S.settings.jobTypes;
  const markets=S.settings.markets;
  const sales=S.settings.sales;

  // Build multi-select HTML for designers (grouped)
  function msDesigners(){
    const sel=c.designers||[];
    const opts=Object.entries(S.settings.designers).map(([group,list])=>
      list.length?`<div class="ms-optgroup-label">${group}</div>${list.map(d=>`
        <label class="ms-item${sel.includes(d)?" checked":""}">
          <input type="checkbox" value="${d}" ${sel.includes(d)?"checked":""} onchange="toggleModalDesigner('${d}',this.checked)"/>
          ${d}
        </label>`).join("")}`:""
    ).join("");
    const label=sel.length?sel.join(", "):"選擇設計師…";
    return `<div class="ms-wrap" id="ms-designer-wrap">
      <button type="button" class="ms-trigger" id="ms-designer-btn" onclick="toggleMsDropdown('ms-designer')">
        <span class="ms-trigger-text">${label}</span><span class="ms-trigger-arrow">▾</span>
      </button>
      <div class="ms-dropdown" id="ms-designer-dd" style="display:none">${opts}</div>
    </div>
    <div class="ms-chips" id="ms-designer-chips">${sel.map(d=>`<span class="ms-chip">${d}<button class="ms-chip-x" onclick="toggleModalDesigner('${d}',false)">×</button></span>`).join("")}</div>`;
  }

  // Build multi-select HTML for jobTypes
  function msJobTypes(){
    const sel=c.jobTypes||[];
    const opts=types.map(j=>`
      <label class="ms-item${sel.includes(j)?" checked":""}">
        <input type="checkbox" value="${j}" ${sel.includes(j)?"checked":""} onchange="toggleModalJobType('${j}',this.checked)"/>
        ${j}
      </label>`).join("");
    const label=sel.length?sel.join(", "):"選擇案件種類…";
    return `<div class="ms-wrap" id="ms-jobtype-wrap">
      <button type="button" class="ms-trigger" id="ms-jobtype-btn" onclick="toggleMsDropdown('ms-jobtype')">
        <span class="ms-trigger-text">${label}</span><span class="ms-trigger-arrow">▾</span>
      </button>
      <div class="ms-dropdown" id="ms-jobtype-dd" style="display:none">${opts}</div>
    </div>
    <div class="ms-chips" id="ms-jobtype-chips">${sel.map(j=>`<span class="ms-chip" style="background:${typeColor(j,types)}22;color:${typeColor(j,types)}">${j}<button class="ms-chip-x" onclick="toggleModalJobType('${j}',false)">×</button></span>`).join("")}</div>`;
  }

  const vacationWarn = isNew && c.designers && c.designers.some(d=>isDesignerOnVacation(d,c.deadline||c.date))
    ? `<div style="background:#FFF3E0;border:1.5px solid #FFB74D;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#E65100">⚠️ 部分設計師在此期間已設定休假，請確認是否仍要派案</div>`
    : "";

  return `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" onclick="closeMsDropdownsOnOutside(event)">
      <h3>${isNew?"+ New Case":"✏️ Edit Case"}</h3>
      <div id="vac-warn">${vacationWarn}</div>
      <div class="form-row">
        <div class="fg-modal"><label>Dispatch Date</label><input type="date" id="f-date" value="${c.date}"/></div>
        <div class="fg-modal"><label>Deadline</label><input type="date" id="f-deadline" value="${c.deadline||""}"/></div>
      </div>
      <div class="form-row">
        <div class="fg-modal"><label>Time <span style="font-weight:400;color:#aaa">(e.g. noon, 17:00)</span></label><input type="text" id="f-deadline-time" placeholder="Optional, e.g. noon, EOD, 17:00" value="${c.deadlineTime||""}"/></div>
      </div>
      <div class="form-row single">
        <div class="fg-modal">
          <label>📎 Notion Project <span style="font-weight:400;color:#aaa">(optional — same name groups into one project)</span></label>
          <input type="text" id="f-notion-project" list="notion-project-list"
            placeholder="例：SBJ Holiday 2027 I&amp;II"
            value="${c.notionProject||""}"
            onchange="onNotionProjectChange(this.value)"
            style="width:100%"/>
          <datalist id="notion-project-list">
            ${[...new Set(S.cases.map(x=>x.notionProject).filter(Boolean))].map(p=>`<option value="${p}"/>`).join("")}
          </datalist>
          ${c.notionPageId?`<div style="margin-top:4px;font-size:10px;color:#27AE60">✅ 已連結 Notion 頁面</div>`:`<div style="margin-top:4px;font-size:10px;color:#aaa">填寫後，下次同步時自動建立或更新 Notion 專案</div>`}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px">
        <div class="fg-modal"><label>Market</label><select id="f-market" onchange="onMarketChange(this.value)">${markets.map(m=>`<option${m===c.market?" selected":""}>${m}</option>`).join("")}</select></div>
        <div class="fg-modal"><label>Type</label>${msJobTypes()}</div>
        <div class="fg-modal"><label>Account</label>
          <select id="f-sales-select">${["",  ...sales].map(s=>`<option${s===c.sales?" selected":""}>${s}</option>`).join("")}</select>
        </div>

      <div class="form-row single">
        <div class="fg-modal"><label>Designer</label>${msDesigners()}</div>
      </div>
      <div class="form-row single">
        <div class="fg-modal"><label>Notes</label><textarea id="f-note" placeholder="Project brief, references...">${c.note||""}</textarea></div>
      </div>
      <div class="form-row single">
        <div class="fg-modal">
          <label>🔗 Links <span style="font-weight:400;color:#aaa;font-size:11px">(synced to timeline — saved per Notion Project)</span></label>
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
            ${renderLinkField("meeting", (S.projectLinks[c.notionProject||""]||{}).meeting_link||"", "Meeting link", "🎥")}

      </div>
      <div class="form-row">
        <div class="fg-modal"><label>Status</label><select id="f-status">${STATUSES.map(s=>`<option${s===c.status?" selected":""}>${s}</option>`).join("")}</select></div>
        <div class="fg-modal"><label>Review <span style="font-weight:400;color:#aaa">(optional)</span></label>
          <div style="display:flex;gap:6px;margin-top:4px">
            ${[{val:"良好",bg:"#EAFAF1",border:"#27AE60",text:"#27AE60"},{val:"混亂",bg:"#FEF9E7",border:"#D4AC0D",text:"#D4AC0D"},{val:"檢討",bg:"#FFF0EE",border:"#E74C3C",text:"#E74C3C"},{val:"",bg:"#F5F5F5",border:"#DDD",text:"#999"}].map(r=>`
            <label style="cursor:pointer;flex:1">
              <input type="radio" name="f-review" value="${r.val}" ${(c.review||"")===(r.val)?"checked":""} style="display:none" onchange=""/>
              <div onclick="selectReview('${r.val}')" style="padding:7px 4px;width:100%;text-align:center;border-radius:7px;border:1.5px solid ${(c.review||"")===(r.val)?r.border:"transparent"};background:${r.bg};font-size:11px;font-weight:700;color:${r.text};cursor:pointer;transition:all .15s">${r.val||"無"}</div>
            </label>`).join("")}
          </div>
        </div>
      </div>
      <div class="modal-btns">
        ${!isNew?`<button class="btn-danger" style="margin-right:auto;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;background:#FFF0EE;color:var(--red);border:1.5px solid #FFCDD2" onclick="deleteCaseFromModal('${c.id}')">🗑 Delete</button>`:""}
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveCase('${c.id}')">${isNew?"Add Case":"Save"}</button>
      </div>
    </div>
  </div>`;
}

// ── VACATION MODAL ─────────────────────────────────────────────
function renderVacationModal(){
  if(!S.vacationModal) return "";
  const {designer}=S.vacationModal;
  const existing=S.vacations.filter(v=>v.designer===designer);

  {key:"settings",label:"Settings"},

  // Timeline tab
  if(S.view==="timeline"){
    const reviewCount=S.cases.filter(c=>c.review).length;

          <div class="logo"><span class="logo-title">Design Dispatch</span><span class="logo-sub">Mona Studio</span></div>

  const cases=filtered();
  const reviewCount=S.cases.filter(c=>c.review).length;

  let content="";
  if(S.view==="list") content=renderList(cases);
  else if(S.view==="excel") content=renderExcel(cases);
  else if(S.view==="stats") content=renderStats();
  else if(S.view==="review") content=renderReview();
  else if(S.view==="settings") content=renderSettings();

  const showFilter=S.view==="list";
  const f=S.filter;
  const markets=S.settings.markets;
  const types=S.settings.jobTypes;
  const designers=allDesigners(S.settings.designers);
  const sales=S.settings.sales;
  const activeFilters=[f.market,f.designer,f.jobType,f.status,f.sales].filter(Boolean).length;

  const filterBar=showFilter?`<div class="filter-bar">
    <div class="fg"><label>Market</label><select onchange="setFilter('market',this.value)">
      <option value="">All</option>${markets.map(m=>`<option${m===f.market?" selected":""}>${m}</option>`).join("")}

function openEdit(id){
  const c=S.cases.find(x=>x.id===id);
  if(c){
    // Normalize legacy single-value fields to arrays
    const normalized={...c, designers:toArr(c.designers||c.designer), jobTypes:toArr(c.jobTypes||c.jobType)};

// ── MULTI-SELECT DROPDOWN LOGIC ────────────────────────────────
// Temporary state for modal multi-selects (lives in S.modal object)
function toggleMsDropdown(id){
  const dd=document.getElementById(`${id}-dd`);
  const btn=document.getElementById(`${id}-btn`);
  if(!dd) return;
  const isOpen=dd.style.display!=="none";
  // Close all first
  document.querySelectorAll(".ms-dropdown").forEach(el=>el.style.display="none");
  document.querySelectorAll(".ms-trigger").forEach(el=>el.classList.remove("open"));
  if(!isOpen){ dd.style.display="block"; btn&&btn.classList.add("open"); }
}
function closeMsDropdownsOnOutside(e){
  if(!e.target.closest(".ms-wrap")){
    document.querySelectorAll(".ms-dropdown").forEach(el=>el.style.display="none");
    document.querySelectorAll(".ms-trigger").forEach(el=>el.classList.remove("open"));
  }
}

function syncModalFields(){
  if(!S.modal) return;
  const reviewEl=document.querySelector("input[name='f-review']:checked");
  const fields={
    date: document.getElementById("f-date")?.value,
    deadline: document.getElementById("f-deadline")?.value||"",
    deadlineTime: document.getElementById("f-deadline-time")?.value||"",
    market: document.getElementById("f-market")?.value,
    status: document.getElementById("f-status")?.value,
    note: document.getElementById("f-note")?.value,
    notionProject: document.getElementById("f-notion-project")?.value||"",
    sales: document.getElementById("f-sales-select")?.value||"",
    review: reviewEl?reviewEl.value:(S.modal._preset?.review||S.modal.review||""),
  };
  if(S.modal._preset){
    Object.assign(S.modal._preset, fields);
  } else {
    Object.assign(S.modal, fields);
  }
}

function toggleModalDesigner(name,checked){
  syncModalFields();
  if(!S.modal||S.modal==="new") S.modal={_preset:{designers:[],jobTypes:[S.settings.jobTypes[0]||"V1"]}};
  const cur=toArr(S.modal.designers||S.modal._preset?.designers||[]);
  const updated=checked?[...new Set([...cur,name])]:cur.filter(d=>d!==name);
  if(S.modal._preset){ S.modal._preset.designers=updated; }
  else { S.modal.designers=updated; }
  render();
}
function toggleModalJobType(name,checked){
  syncModalFields();
  if(!S.modal||S.modal==="new") S.modal={_preset:{jobTypes:[],designers:[]}};
  const cur=toArr(S.modal.jobTypes||S.modal._preset?.jobTypes||[]);
  const updated=checked?[...new Set([...cur,name])]:cur.filter(j=>j!==name);
  if(S.modal._preset){ S.modal._preset.jobTypes=updated; }
  else { S.modal.jobTypes=updated; }
  render();
}
function selectReview(val){
  syncModalFields();
  if(S.modal._preset){ S.modal._preset.review=val; }
  else if(S.modal){ S.modal.review=val; }
  render();
}

function saveCase(id){
  syncModalFields();
  const isNew=!id||S.modal._preset;
  const curDesigners = isNew ? toArr(S.modal._preset?.designers) : toArr(S.modal.designers);
  const curJobTypes  = isNew ? toArr(S.modal._preset?.jobTypes)  : toArr(S.modal.jobTypes);
  const curReview    = isNew ? (S.modal._preset?.review||"")     : (S.modal.review||"");
  const sales=document.getElementById("f-sales-select")?.value||"";
  const notionProject=document.getElementById("f-notion-project")?.value.trim()||"";
  const notionPageId=(isNew?"":(S.modal.notionPageId||""));
  const c={
    id:id||uid(),
    date:document.getElementById("f-date").value,
    deadline:document.getElementById("f-deadline").value||"",
    deadlineTime:document.getElementById("f-deadline-time")?.value.trim()||"",
    market:document.getElementById("f-market").value,
    jobTypes:curJobTypes.length?curJobTypes:[S.settings.jobTypes[0]||"V1"],
    designers:curDesigners.length?curDesigners:[allDesigners(S.settings.designers)[0]||""],
    sales,
    status:document.getElementById("f-status").value,
    note:document.getElementById("f-note").value,
    emailLink:isNew?"":(S.modal.emailLink||""),
    review:curReview,
    notionProject,
    notionPageId,
    designerStatus:isNew?{}:(S.modal.designerStatus||{}),
  };
  // 若 case-level status 設為已完成，所有設計師狀態一併升為已完成
  if(c.status==="已完成"){
    toArr(c.designers).forEach(d=>{ c.designerStatus[d]="已完成"; });
  }
  if(id&&!isNew){ S.cases=S.cases.map(x=>x.id===id?c:x); }
  else { S.cases=[c,...S.cases]; }
  saveCase_db(c);
  saveProjectLinks(c.notionProject);
  S.editingLinks={};
  S.modal=null; S.parseText=""; S.parseStatus="";
  render();
}

function deleteCaseFromModal(id){
  if(!confirm("確定刪除此案件？")) return;
  S.cases=S.cases.filter(c=>c.id!==id);
  removeThumb(id);
  deleteCaseDb(id);
  S.modal=null;
  render();
}

function deleteCase(id){
  if(!confirm("確定刪除此案件？")) return;
  S.cases=S.cases.filter(c=>c.id!==id);
  removeThumb(id);
  deleteCaseDb(id);
  render();
}

async function quickDesignerStatus(caseId,designer,nextStatus){
  const idx=S.cases.findIndex(x=>x.id===caseId);
  if(idx<0) return;
  const c={...S.cases[idx]};
  c.designerStatus={...c.designerStatus,[designer]:nextStatus};
  // 如果所有設計師都已完成，自動將 case-level status 升為已完成
  const allDesignersInCase=toArr(c.designers);
  const allDone=allDesignersInCase.length>0&&allDesignersInCase.every(d=>(c.designerStatus[d]||"進行中")==="已完成");
  if(allDone) c.status="已完成";
  else if(c.status==="已完成"&&!allDone) c.status="進行中"; // 有人取消完成則回退
  S.cases[idx]=c;
  render();
  saveCase_db(c, false); // 僅更新狀態，不重新 sync Notion
}

function removeSales(i){ S.settings.sales.splice(i,1); saveSettings(S.settings); render(); }
function renameSales(i,v){ if(v) S.settings.sales[i]=v; saveSettings(S.settings); }

// ── EMAIL PARSER ───────────────────────────────────────────────
function parseEmail(){
  const text=S.parseText||"";
  if(!text.trim()){ S.parseStatus="請貼上信件內容"; render(); return; }
  const txt=text.toUpperCase();
  const result={};
  for(const m of S.settings.markets){ if(txt.includes(m.toUpperCase())){ result.market=m; break; } }
  for(const j of S.settings.jobTypes){ if(txt.toUpperCase().includes(j.toUpperCase())){ result.jobType=j; break; } }
  const dlMatch=text.match(/(?:deadline|截止|due|by|before)[^\d]*(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/i)||text.match(/(\d{4}[-\/]\d{1,2}[-\/]\d{1,2})/);
  if(dlMatch){ result.deadline=dlMatch[1].replace(/\//g,"-"); }
  for(const d of allDesigners(S.settings.designers)){ if(text.includes(d)){ result.designer=d; break; } }
  for(const s of S.settings.sales){ if(text.toLowerCase().includes(s.toLowerCase())){ result.sales=s; break; } }
  if(result.market){ const el=document.getElementById("f-market"); if(el) el.value=result.market; }
  if(result.jobType){
    if(S.modal&&S.modal._preset){ S.modal._preset.jobTypes=[result.jobType]; }
    else if(S.modal){ S.modal.jobTypes=[result.jobType]; }
  }
  if(result.deadline){ const el=document.getElementById("f-deadline"); if(el) el.value=result.deadline; }
  if(result.designer){
    if(S.modal&&S.modal._preset){ S.modal._preset.designers=[result.designer]; }
    else if(S.modal){ S.modal.designers=[result.designer]; }
  }
  const found=Object.keys(result).length;
  S.parseStatus=found
    ? `✅ 辨識到 ${found} 個欄位：${Object.entries(result).map(([k,v])=>`${k}=${v}`).join("、")}`
    : "⚠️ 未辨識到已知欄位，請手動填寫";
  const ps=document.getElementById("parse-status");
  if(ps) ps.textContent=S.parseStatus;
}

// ── VACATION ACTIONS ───────────────────────────────────────────
function openVacationModal(designer){ S.vacationModal={designer}; S.editingVacIdx=null; render(); }
function closeVacationModal(){ S.vacationModal=null; S.editingVacIdx=null; render(); }

function toggleNewVacHours(){
  const sel=document.getElementById("vac-hours-sel");
  const custom=document.getElementById("vac-hours-custom");
  if(sel&&custom){ custom.style.display=sel.value==="custom"?"block":"none"; }
}
function toggleEditVacHours(i){
  const sel=document.getElementById(`edit-vac-hours-sel-${i}`);
  const custom=document.getElementById(`edit-vac-hours-custom-${i}`);
  if(sel&&custom){ custom.style.display=sel.value==="custom"?"block":"none"; }
}

async function addVacation(designer){
  const start=document.getElementById("vac-start")?.value;
  const end=document.getElementById("vac-end")?.value;
  const vacType=document.getElementById("vac-type")?.value||"特休";
  const hoursSel=document.getElementById("vac-hours-sel")?.value||"";
  const hoursCustom=document.getElementById("vac-hours-custom")?.value||"";
  const note=document.getElementById("vac-note")?.value.trim()||"";
  if(!start||!end){ alert("請選擇日期"); return; }
  if(end<start){ alert("結束日期不能早於開始日期"); return; }
  let hours=null;
  if(hoursSel==="custom"&&hoursCustom) hours=parseFloat(hoursCustom);
  else if(hoursSel) hours=parseFloat(hoursSel);
  const v=await addVacationDb(designer,start,end,vacType,hours,note);
  if(v){ S.vacations.push(v); render(); }
}

async function saveEditVacation(designer,idx){
  const list=S.vacations.filter(v=>v.designer===designer);
  const target=list[idx];
  if(!target) return;
  const start=document.getElementById(`edit-vac-start-${idx}`)?.value;
  const end=document.getElementById(`edit-vac-end-${idx}`)?.value;
  const vacType=document.getElementById(`edit-vac-type-${idx}`)?.value||"特休";
  const hoursSel=document.getElementById(`edit-vac-hours-sel-${idx}`)?.value||"";
  const hoursCustom=document.getElementById(`edit-vac-hours-custom-${idx}`)?.value||"";
  const note=document.getElementById(`edit-vac-note-${idx}`)?.value.trim()||"";
  if(!start||!end){ alert("請選擇日期"); return; }
  if(end<start){ alert("結束日期不能早於開始日期"); return; }
  let hours=null;
  if(hoursSel==="custom"&&hoursCustom) hours=parseFloat(hoursCustom);
  else if(hoursSel) hours=parseFloat(hoursSel);
  const globalIdx=S.vacations.indexOf(target);
  const updated={...target,start,end,vacType,hours,note};
  S.vacations[globalIdx]=updated;
  await updateVacationDb(target._dbId,{start,end,vacType,hours,note});
  S.editingVacIdx=null;
  render();
}

async function deleteVacation(designer,idx){
  if(!confirm("確定刪除此休假記錄？")) return;
  const list=S.vacations.filter(v=>v.designer===designer);
  const target=list[idx];
  if(!target) return;
  const globalIdx=S.vacations.indexOf(target);
  S.vacations.splice(globalIdx,1);
  await removeVacationDb(target._dbId);
  S.editingVacIdx=null;
  render();
}

// ── FREE ROW ACTIONS ───────────────────────────────────────────
function addFreeRow(){
  const row={id:uid(),label:"備注列",cells:{}};
  S.freeRows.push(row);
  saveFreeRowDb(row);
  render();
}
function deleteFreeRow(id){
  S.freeRows=S.freeRows.filter(r=>r.id!==id);
  deleteFreeRowDb(id);
  render();
}
function saveFreeRowLabel(id,label){
  const row=S.freeRows.find(r=>r.id===id);
  if(row){ row.label=label; saveFreeRowDb(row); }
}
function addFreeCellLine(rowId,date){
  const row=S.freeRows.find(r=>r.id===rowId);
  if(!row) return;
  if(!row.cells[date]) row.cells[date]=[];
  row.cells[date].push({text:"",struck:false});
  saveFreeRowDb(row);
  render();
}
function saveFreeCell(rowId,date,idx,text){
  const row=S.freeRows.find(r=>r.id===rowId);
  if(!row) return;
  if(!row.cells[date]) row.cells[date]=[];
  if(!row.cells[date][idx]) row.cells[date][idx]={text:"",struck:false};
  row.cells[date][idx].text=text;
  saveFreeRowDb(row);
}
function toggleFreeCellStrike(rowId,date,idx){
  const row=S.freeRows.find(r=>r.id===rowId);
  if(!row||!row.cells[date]||!row.cells[date][idx]) return;
  row.cells[date][idx].struck=!row.cells[date][idx].struck;
  saveFreeRowDb(row);
  render();
}

      <div style="font-size:24px">🎨</div>

      <div style="width:200px;height:3px;background:#eee;border-radius:2px;overflow:hidden">
        <div style="height:100%;background:var(--accent);border-radius:2px;animation:load-bar 1.5s ease infinite" id="load-bar"></div>
      </div>
    </div>
    <style>@keyframes load-bar{0%{width:0%}50%{width:70%}100%{width:100%}}</style>`;
  try {
    const [cases,settings,vacations,freeRows]=await Promise.all([
      loadCases(), loadSettings(), loadVacations(), loadFreeRows()
    ]);
    S.cases=cases;
    S.settings=settings;

      <div style="font-size:20px;margin-bottom:12px">❌ 載入失敗</div>
      <div style="font-size:13px;color:#888">無法連接到資料庫，請檢查網路後重新整理</div>
    </div>`;
  }
}

initApp();
</script>
