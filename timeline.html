<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Project Timeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1a1a1a;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 16px; font-weight: 600; flex: 1; }
    .btn-today {
      background: #2383e2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-today:hover { background: #1a6fc4; }
    .zoom-btns { display: flex; gap: 4px; }
    .zoom-btns button {
      background: #f0f0ee;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .zoom-btns button:hover { background: #e5e5e3; }
    .zoom-btns button.active { background: #2383e2; color: #fff; border-color: #2383e2; }
    .last-updated { font-size: 11px; color: #999; }

    /* ── Legend ── */
    .legend {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .legend-label { font-size: 11px; color: #888; margin-right: 4px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    /* ── Main layout ── */
    .gantt-wrapper {
      display: flex;
      overflow: hidden;
      height: calc(100vh - 89px);
    }

    /* ── Left label column ── */
    .label-col {
      width: 220px;
      min-width: 220px;
      border-right: 1px solid #e5e5e5;
      background: #fff;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 10;
    }
    .label-header {
      height: 48px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: #888;
      font-weight: 500;
      background: #fafaf9;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .label-row {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid #f0f0ee;
      gap: 4px;
      cursor: default;
    }
    .label-row.child-row { padding-left: 28px; background: #fafaf9; }
    .label-row:hover { background: #f5f5f3; }
    .toggle-btn {
      width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border-radius: 3px;
      flex-shrink: 0;
      color: #888;
      font-size: 10px;
      transition: transform 0.15s;
    }
    .toggle-btn:hover { background: #e8e8e6; }
    .toggle-btn.open { transform: rotate(90deg); }
    .label-spacer { width: 16px; flex-shrink: 0; }
    .label-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      font-size: 13px;
    }
    .label-row.child-row .label-name { font-size: 12px; color: #555; }

    /* ── Right chart area ── */
    .chart-area {
      flex: 1;
      overflow: auto;
      position: relative;
    }
    .chart-inner {
      position: relative;
      min-height: 100%;
    }

    /* ── Date header ── */
    .date-header {
      height: 48px;
      background: #fafaf9;
      border-bottom: 1px solid #e5e5e5;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .month-labels {
      height: 22px;
      position: relative;
      border-bottom: 1px solid #eee;
    }
    .month-label {
      position: absolute;
      top: 0;
      height: 22px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      border-right: 1px solid #eee;
    }
    .day-labels {
      height: 26px;
      position: relative;
    }
    .day-label {
      position: absolute;
      top: 0;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #aaa;
      border-right: 1px solid #f0f0ee;
    }
    .day-label.today-label { color: #e03e3e; font-weight: 700; }

    /* ── Rows ── */
    .row-container { position: relative; }
    .chart-row {
      height: 36px;
      border-bottom: 1px solid #f0f0ee;
      position: relative;
    }
    .chart-row.child-row { background: #fafaf9; }

    /* ── Today line ── */
    .today-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e03e3e;
      z-index: 8;
      pointer-events: none;
    }
    .today-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e03e3e;
    }

    /* ── Bars ── */
    .bar {
      position: absolute;
      top: 6px;
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: filter 0.1s;
      min-width: 4px;
    }
    .bar:hover { filter: brightness(0.92); }
    .bar.child-bar {
      top: 9px;
      height: 18px;
      border-radius: 4px;
      font-size: 10px;
    }

    /* ── Status colors ── */
    .status-待確認  { background: #f5e642; color: #5a4e00; }
    .status-進行中  { background: #6abf69; color: #fff; }
    .status-已完成  { background: #b0bec5; color: #fff; }
    .status-暫停    { background: #ffb74d; color: #fff; }
    .status-取消    { background: #ef9a9a; color: #fff; }
    .status-default { background: #90caf9; color: #fff; }

    /* ── Loading / Error ── */
    .status-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #888;
    }
    .status-msg .spinner {
      width: 28px; height: 28px;
      border: 3px solid #ddd;
      border-top-color: #2383e2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tooltip ── */
    .tooltip {
      position: fixed;
      background: #1a1a1a;
      color: #fff;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12px;
      pointer-events: none;
      z-index: 200;
      max-width: 280px;
      line-height: 1.6;
      display: none;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📅 Design Project Timeline</h1>
  <span class="last-updated" id="lastUpdated"></span>
  <div class="zoom-btns">
    <button onclick="setZoom('week')" id="zoom-week">週</button>
    <button onclick="setZoom('biweek')" id="zoom-biweek" class="active">雙週</button>
    <button onclick="setZoom('month')" id="zoom-month">月</button>
  </div>
  <button class="btn-today" onclick="scrollToToday()">今日</button>
</div>

<div class="legend" id="legend"></div>

<div class="gantt-wrapper">
  <div class="label-col" id="labelCol">
    <div class="label-header">專案名稱</div>
    <div id="labelRows"></div>
  </div>
  <div class="chart-area" id="chartArea">
    <div class="chart-inner" id="chartInner">
      <div class="date-header" id="dateHeader"></div>
      <div id="chartRows"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="status-msg" id="statusMsg">
  <div class="spinner"></div>
  載入中…
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://lczpbtkoxsvlsucbqoxp.supabase.co/functions/v1/get-timeline';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjenBidGtveHN2bHN1Y2Jxb3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDgzNzUsImV4cCI6MjA5NDY4NDM3NX0.KtA-AwVW2ecHajexiKsiM-ZKLgG3wC8pcpq4vPp3SHw';

// ── State ─────────────────────────────────────────────────────────────────────
let allItems = [];
let rootItems = [];
let expanded = new Set();
let zoomDayWidth = 38; // px per day (biweek default)
let zoomMode = 'biweek';
let rangeStart, rangeEnd, totalDays;

const STATUS_COLORS = {
  '待確認': 'status-待確認',
  '進行中': 'status-進行中',
  '已完成': 'status-已完成',
  '暫停':   'status-暫停',
  '取消':   'status-取消',
};

// ── Fetch data ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch(SUPABASE_URL, {
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { items } = await res.json();
    allItems = items;
    buildHierarchy();
    render();
    document.getElementById('statusMsg').style.display = 'none';
    document.getElementById('lastUpdated').textContent =
      '更新：' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    document.getElementById('statusMsg').innerHTML =
      `<div style="color:#e03e3e">載入失敗：${e.message}</div>`;
  }
}

// ── Build tree ─────────────────────────────────────────────────────────────────
function buildHierarchy() {
  const map = {};
  allItems.forEach(item => { map[item.id] = { ...item, children: [] }; });

  rootItems = [];
  allItems.forEach(item => {
    if (item.parentId && map[item.parentId]) {
      map[item.parentId].children.push(map[item.id]);
    } else if (!item.parentId) {
      rootItems.push(map[item.id]);
    }
  });

  // Sort roots by start date descending (newest first)
  rootItems.sort((a, b) => (b.start || '').localeCompare(a.start || ''));
}

// ── Compute date range ─────────────────────────────────────────────────────────
function computeRange() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let minDate = new Date(today);
  let maxDate = new Date(today);
  maxDate.setDate(maxDate.getDate() + 30);

  allItems.forEach(item => {
    if (item.start) {
      const d = new Date(item.start);
      if (d < minDate) minDate = d;
    }
    if (item.end) {
      const d = new Date(item.end);
      if (d > maxDate) maxDate = d;
    }
  });

  // Add padding
  minDate.setDate(minDate.getDate() - 7);
  maxDate.setDate(maxDate.getDate() + 14);

  rangeStart = minDate;
  rangeEnd = maxDate;
  totalDays = Math.ceil((rangeEnd - rangeStart) / 86400000) + 1;
}

// ── Date helpers ───────────────────────────────────────────────────────────────
function dayOffset(dateStr) {
  const d = new Date(dateStr);
  d.setHours(0, 0, 0, 0);
  return Math.round((d - rangeStart) / 86400000);
}

function todayOffset() {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return Math.round((t - rangeStart) / 86400000);
}

function fmt(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  computeRange();
  renderDateHeader();
  renderRows();
  renderLegend();
  setTimeout(scrollToToday, 50);
}

function renderDateHeader() {
  const header = document.getElementById('dateHeader');
  const totalWidth = totalDays * zoomDayWidth;

  // Month row
  let monthHtml = '';
  let cur = new Date(rangeStart);
  while (cur <= rangeEnd) {
    const monthStart = dayOffset(cur.toISOString().split('T')[0]);
    const label = `${cur.getFullYear()}年${cur.getMonth()+1}月`;
    const nextMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const monthEnd = Math.min(dayOffset(nextMonth.toISOString().split('T')[0]), totalDays);
    const w = (monthEnd - monthStart) * zoomDayWidth;
    monthHtml += `<div class="month-label" style="left:${monthStart*zoomDayWidth}px;width:${w}px">${label}</div>`;
    cur = nextMonth;
  }

  // Day row
  let dayHtml = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(rangeStart);
    d.setDate(d.getDate() + i);
    const isToday = d.getTime() === today.getTime();
    const dow = ['日','一','二','三','四','五','六'][d.getDay()];
    const showLabel = zoomDayWidth >= 28 || d.getDay() === 1 || isToday;
    const cls = isToday ? 'day-label today-label' : 'day-label';
    dayHtml += `<div class="${cls}" style="left:${i*zoomDayWidth}px;width:${zoomDayWidth}px">
      ${showLabel ? `${d.getDate()}<br><span style="font-size:9px">${dow}</span>` : ''}
    </div>`;
  }

  header.innerHTML = `
    <div class="month-labels" style="width:${totalWidth}px">${monthHtml}</div>
    <div class="day-labels" style="width:${totalWidth}px">${dayHtml}</div>
  `;
}

function renderRows() {
  const labelRows = document.getElementById('labelRows');
  const chartRows = document.getElementById('chartRows');
  const totalWidth = totalDays * zoomDayWidth;

  // Today line HTML (shared across all rows via absolute positioning on chartInner)
  const todayX = todayOffset() * zoomDayWidth;
  document.getElementById('chartInner').style.width = totalWidth + 'px';

  let labelHtml = '';
  let chartHtml = `<div class="today-line" style="left:${todayX}px;top:48px"></div>`;

  function addRow(item, isChild) {
    const hasChildren = item.children && item.children.length > 0;
    const isExpanded = expanded.has(item.id);

    // Label
    if (isChild) {
      labelHtml += `<div class="label-row child-row" data-id="${item.id}">
        <span class="label-spacer"></span>
        <span class="label-name" title="${item.name}">${item.name}</span>
      </div>`;
    } else {
      const toggleIcon = hasChildren
        ? `<span class="toggle-btn ${isExpanded ? 'open' : ''}" onclick="toggleExpand('${item.id}')">▶</span>`
        : `<span class="label-spacer"></span>`;
      labelHtml += `<div class="label-row" data-id="${item.id}">
        ${toggleIcon}
        <span class="label-name" title="${item.name}">${item.name}</span>
      </div>`;
    }

    // Chart row
    const rowCls = isChild ? 'chart-row child-row' : 'chart-row';
    let barHtml = '';

    if (item.start) {
      const startX = dayOffset(item.start) * zoomDayWidth;
      const endX = (dayOffset(item.end || item.start) + 1) * zoomDayWidth;
      const barW = Math.max(endX - startX, 4);
      const colorCls = STATUS_COLORS[item.status] || 'status-default';
      const barCls = isChild ? `bar child-bar ${colorCls}` : `bar ${colorCls}`;
      const label = barW > 40 ? item.name : '';
      barHtml = `<div class="${barCls}" style="left:${startX}px;width:${barW}px"
        data-id="${item.id}"
        onmouseenter="showTooltip(event,'${item.id}')"
        onmouseleave="hideTooltip()"
        onclick="openNotion('${item.url}')"
      >${label}</div>`;
    }

    chartHtml += `<div class="${rowCls}" style="width:${totalWidth}px" data-id="${item.id}">${barHtml}</div>`;

    // Children (if expanded)
    if (hasChildren && isExpanded) {
      item.children
        .slice()
        .sort((a, b) => (a.start || '').localeCompare(b.start || ''))
        .forEach(child => addRow(child, true));
    }
  }

  rootItems.forEach(item => addRow(item, false));

  labelRows.innerHTML = labelHtml;
  chartRows.innerHTML = chartHtml;

  // Sync scroll between label and chart
  const labelCol = document.getElementById('labelCol');
  const chartArea = document.getElementById('chartArea');
  labelCol.scrollTop = chartArea.scrollTop;
}

function renderLegend() {
  const statuses = [...new Set(allItems.map(i => i.status).filter(Boolean))];
  const legendEl = document.getElementById('legend');
  let html = '<span class="legend-label">案件狀態：</span>';
  statuses.forEach(s => {
    const cls = STATUS_COLORS[s] || 'status-default';
    // Get bg color from a temp element
    html += `<span class="legend-item"><span class="legend-dot ${cls}"></span>${s}</span>`;
  });
  legendEl.innerHTML = html;
}

// ── Interactions ──────────────────────────────────────────────────────────────
function toggleExpand(id) {
  if (expanded.has(id)) expanded.delete(id);
  else expanded.add(id);
  renderRows();
  // Re-sync scroll
  const chartArea = document.getElementById('chartArea');
  document.getElementById('labelCol').scrollTop = chartArea.scrollTop;
}

function scrollToToday() {
  const chartArea = document.getElementById('chartArea');
  const todayX = todayOffset() * zoomDayWidth;
  const offset = todayX - chartArea.clientWidth * 0.25;
  chartArea.scrollLeft = Math.max(0, offset);
}

function setZoom(mode) {
  zoomMode = mode;
  const widths = { week: 56, biweek: 38, month: 22 };
  zoomDayWidth = widths[mode];
  ['week','biweek','month'].forEach(m => {
    document.getElementById('zoom-'+m).classList.toggle('active', m === mode);
  });
  render();
}

function openNotion(url) {
  if (url) window.open(url, '_blank');
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
const itemMap = {};
function buildItemMap() { allItems.forEach(i => { itemMap[i.id] = i; }); }

function showTooltip(e, id) {
  if (!itemMap[id]) buildItemMap();
  const item = itemMap[id];
  if (!item) return;
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `
    <strong>${item.name}</strong><br>
    📅 ${fmt(item.start)} — ${fmt(item.end)}<br>
    ${item.status ? `🏷 ${item.status}` : ''}
  `;
  tip.style.display = 'block';
  moveTooltip(e);
}

function moveTooltip(e) {
  const tip = document.getElementById('tooltip');
  tip.style.left = (e.clientX + 14) + 'px';
  tip.style.top  = (e.clientY - 10) + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

document.addEventListener('mousemove', (e) => {
  if (document.getElementById('tooltip').style.display !== 'none') moveTooltip(e);
});

// ── Scroll sync ───────────────────────────────────────────────────────────────
document.getElementById('chartArea').addEventListener('scroll', function() {
  document.getElementById('labelCol').scrollTop = this.scrollTop;
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
