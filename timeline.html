<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #ffffff;
    --surface:  #ffffff;
    --surface2: #f0eee9;
    --border:   #e8e5df;
    --text:     #1a1817;
    --text-mid: #5c5852;
    --text-dim: #9b9590;
    --today:    #4361EE;
    --row-h:    84px;
    --hdr-band: 30px;
    --ph-band:  40px;
    --bar-pad:  7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans TC', -apple-system, sans-serif;
    font-size: 13px; overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 30;
  }
  #topbar h1 { font-size: 14px; font-weight: 700; margin-right: 2px; }
  .btn {
    padding: 4px 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-mid); cursor: pointer;
    font-size: 12px; font-family: inherit; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--surface2); color: var(--text); border-color: #ccc9c2; }
  .btn.active { background: #1a1817; border-color: #1a1817; color: #fff; }
  .sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
  .grp-label { font-size: 11px; color: var(--text-dim); }
  #status-msg { margin-left: auto; font-size: 11px; color: var(--text-dim); }

  /* ── Main scroll ── */
  #main-scroll { flex: 1; overflow: auto; position: relative; }
  #content-wrap { position: relative; }

  /* ── Date header (sticky) ── */
  #date-hdr {
    position: sticky; top: 0; z-index: 15;
    display: flex; background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 40px; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .day-cell {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-right: 1px solid var(--border);
    font-size: 10px; color: var(--text-dim); position: relative;
    gap: 1px;
  }
  .day-cell.today   { color: var(--today); font-weight: 700; }
  .day-cell.weekend { color: #bbb5ac; }
  .day-cell.weekend { background: rgba(0,0,0,.03); }
  .day-cell.mon     { border-right-color: #d4cfc8; }
  .day-cell .day-date { font-size: 10px; }
  .day-cell .day-dow  { font-size: 9px; opacity: .75; }
  .day-cell .today-dot {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--today);
  }

  /* ── Rows ── */
  #rows-wrap { position: relative; }
  .proj-row {
    height: var(--row-h); position: relative;
    border-bottom: 1px solid var(--border);
  }
  /* .proj-row.even — removed, no alternating row tint */

  /* Grid lines */
  .grid-line {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(0,0,0,.055); pointer-events: none;
  }
  .grid-line.mon { background: rgba(0,0,0,.11); }

  /* Today line */
  .today-line {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--today); opacity: .5;
    pointer-events: none; z-index: 6;
  }

  /* ── Project bar ── */
  .proj-bar {
    position: absolute;
    top: var(--bar-pad);
    height: calc(var(--hdr-band) + var(--ph-band));
    border-radius: 6px; overflow: hidden;
    z-index: 3; box-shadow: 0 1px 4px rgba(0,0,0,.10);
  }

  /* Name header band */
  .bar-header {
    height: var(--hdr-band);
    display: flex; align-items: center; gap: 0;
    padding: 0 8px; overflow: hidden;
    cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  .bar-header:hover { filter: brightness(.93); }
  .bar-hdr-name { font-size: 10px; font-weight: 600; color: #fff; }
  .bar-hdr-type { font-size: 9px; color: rgba(255,255,255,.78); margin-left: 4px; }
  .bar-hdr-link {
    margin-left: auto; font-size: 10px; color: rgba(255,255,255,.8);
    text-decoration: none; flex-shrink: 0; padding-left: 6px;
  }
  .bar-hdr-link:hover { color: #fff; }

  /* Phase band */
  .bar-phases {
    height: var(--ph-band);
    position: relative; overflow: hidden;
  }

  /* Phase segment */
  .phase-seg {
    position: absolute; top: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; overflow: hidden; white-space: nowrap;
    border-right: 1px solid rgba(255,255,255,.30);
    user-select: none; transition: filter .1s;
  }
  .phase-seg:last-child { border-right: none; }
  .phase-seg:hover { filter: brightness(.93); }
  .phase-seg.past { background: #EBEBEB !important; color: #AAAAAA !important; }
  .phase-seg.current { box-shadow: inset 0 0 0 2px currentColor; }
  .seg-label {
    padding: 0 5px; pointer-events: none;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    font-weight: 500;
  }
  /* Resize handle hint */
  .phase-seg .resize-handle {
    position: absolute; right: 0; top: 0; bottom: 0; width: 6px;
    cursor: ew-resize;
  }

  /* Empty bar (no phases) */
  .bar-empty {
    height: var(--ph-band);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; cursor: crosshair;
    border-top: 1px dashed rgba(255,255,255,.3);
  }

  /* Market group header */
  .market-group-hdr {
    height: 26px;
    display: flex; align-items: center;
    background: #F5F5FC;
    border-bottom: 1px solid #DDDDF0;
    border-top: 2px solid #DDDDF0;
    z-index: 2;
    flex-shrink: 0;
  }
  .mkt-lbl {
    font-size: 10px; font-weight: 700; color: #4361EE;
    letter-spacing: .07em; text-transform: uppercase;
    padding: 0 14px;
    position: sticky; left: 0; z-index: 1;
    pointer-events: none; background: #F5F5FC;
  }

  /* .bar-deadline-band — removed; deadline chip now sits on the header band */
  .deadline-chip {
    position: absolute; right: 14px; top: 7px;
    color: rgba(255,255,255,.95);
    font-size: 16px; font-weight: 700;
    white-space: nowrap; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.20);
    letter-spacing: -.5px;
  }
  .deadline-chip.urgent { color: #FFCBC5; }
  .deadline-chip.warn   { color: #FFE8A0; }

  /* ── Popup ── */
  .popup {
    position: fixed; z-index: 200; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.13); min-width: 300px; max-width: 360px;
    display: none; max-height: 88vh; overflow-y: auto;
  }
  .popup.visible { display: block; }
  .popup-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .popup-meta  { font-size: 11px; color: var(--text-mid); margin-bottom: 10px; }
  .popup-divider { height: 1px; background: var(--border); margin: 11px 0; }
  .popup-section {
    font-size: 10px; color: var(--text-dim); font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
  }

  .phase-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 7px; border-radius: 7px; margin-bottom: 4px;
    background: var(--bg); font-size: 11px; cursor: pointer;
  }
  .phase-item:hover { background: var(--surface2); }
  .phase-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .phase-name-lbl  { font-weight: 600; flex: 1; }
  .phase-dates-lbl { font-size: 10px; color: var(--text-mid); white-space: nowrap; }
  .phase-del {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 13px; line-height: 1; padding: 0 2px; flex-shrink: 0;
  }
  .phase-del:hover { color: #dc2626; }

  .reorder-btns { display: flex; flex-direction: column; flex-shrink: 0; }
  .reorder-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 7px; line-height: 1.3; padding: 1px 2px; font-family: inherit;
  }
  .reorder-btn:hover { color: var(--text); }

  #add-phase-toggle {
    width: 100%; padding: 6px; border-radius: 7px; margin-top: 4px;
    border: 1px dashed var(--border); background: none; color: var(--text-dim);
    cursor: pointer; font-size: 11px; font-family: inherit; text-align: left;
  }
  #add-phase-toggle:hover { background: var(--surface2); border-style: solid; color: var(--text); }
  #add-phase-form { display: none; margin-top: 8px; }
  #add-phase-form.open { display: block; }
  .form-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .form-field { flex: 1; }
  .form-field label { font-size: 10px; color: var(--text-dim); display: block; margin-bottom: 3px; }
  .form-field select, .form-field input[type="date"], .form-field input[type="text"] {
    width: 100%; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 11px; font-family: inherit;
  }
  .form-field select:focus, .form-field input:focus { outline: none; border-color: #6b9cf5; }
  #custom-phase-input { display: none; margin-top: 4px; }
  #custom-phase-input input {
    width: 100%; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 11px; font-family: inherit;
  }
  .add-btn {
    width: 100%; padding: 6px; border-radius: 7px; border: none;
    background: #1a1817; color: #fff; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 2px;
  }
  .add-btn:hover { background: #2d2926; }

  .leader-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; }
  .leader-label { font-size: 10px; color: var(--text-dim); font-weight: 700; width: 82px; flex-shrink: 0; }
  .leader-input {
    flex: 1; padding: 5px 8px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 11px; font-family: inherit;
  }
  .leader-input:focus { outline: none; border-color: #6b9cf5; }

  .link-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
  .link-lbl { font-size: 10px; color: var(--text-dim); font-weight: 600; width: 56px; flex-shrink: 0; }
  .link-val { flex: 1; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-val a { color: #3b82f6; text-decoration: none; }
  .link-val a:hover { text-decoration: underline; }
  .link-val.empty { color: var(--text-dim); }
  .link-edit-btn {
    display: block; width: 100%; margin-top: 4px; padding: 5px;
    border-radius: 7px; border: 1px solid var(--border); background: none;
    color: var(--text-dim); cursor: pointer; font-size: 11px; font-family: inherit;
  }
  .link-edit-btn:hover { background: var(--surface2); color: var(--text); }
  .link-field { margin-bottom: 8px; }
  .link-field label { font-size: 11px; color: var(--text-mid); display: block; margin-bottom: 3px; font-weight: 500; }
  .link-field input {
    width: 100%; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 11px; font-family: inherit;
  }
  .link-field input:focus { outline: none; border-color: #6b9cf5; }
  .save-btn {
    width: 100%; padding: 6px; border-radius: 7px; border: none;
    background: #1a1817; color: #fff; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-top: 4px;
  }
  .save-btn:hover { background: #2d2926; }
  .popup-close {
    width: 100%; padding: 5px; border-radius: 7px; margin-top: 6px;
    border: 1px solid var(--border); background: none; color: var(--text-dim);
    cursor: pointer; font-size: 11px; font-family: inherit;
  }
  .popup-close:hover { background: var(--surface2); color: var(--text); }

  /* Note textarea in deadline popup */
  .note-textarea {
    width: 100%; min-height: 80px; padding: 8px 10px;
    border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 11px; font-family: inherit;
    resize: vertical; line-height: 1.6;
  }
  .note-textarea:focus { outline: none; border-color: #6b9cf5; }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 400; flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px; border: 2px solid var(--border);
    border-top-color: #1a1817; border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text-dim); font-size: 13px; }

  /* ── Drag ghost ── */
  #drag-ghost {
    position: fixed; pointer-events: none; z-index: 100; display: none;
    background: rgba(67,97,238,.16); border: 2px dashed #4361EE;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>載入資料中…</p></div>

<!-- Popup -->
<div id="sch-popup" class="popup">
  <div id="sch-title" class="popup-title"></div>
  <div id="sch-meta"  class="popup-meta"></div>
  <div id="sch-designers-row" style="display:none;font-size:11px;color:var(--text-mid);margin:2px 0 8px;line-height:1.5"></div>

  <div id="sch-leader-section">
    <div class="leader-row">
      <span class="leader-label">Project Leader</span>
      <input id="leader-input" type="text" class="leader-input" placeholder="輸入負責人…" onblur="saveLeader()">
    </div>
  </div>

  <div id="sch-phase-section">
    <div class="popup-divider"></div>
    <div class="popup-section">時程規劃</div>
    <div id="sch-phases"></div>
    <button id="add-phase-toggle" onclick="toggleAddForm()">＋ 新增時程</button>
    <div id="add-phase-form">
      <div class="form-row">
        <div class="form-field" style="flex:1.4">
          <label>階段名稱</label>
          <select id="phase-name-select" onchange="onPhaseNameChange()">
            <option>討論</option>
            <option>3D草稿/2D包現有型體</option>
            <option>草稿/彩稿</option>
            <option>合成</option>
            <option>微調</option>
            <option>上版/完成</option>
            <option>找資料</option>
            <option value="__custom__">自訂…</option>
          </select>
          <div id="custom-phase-input">
            <input id="custom-phase-text" type="text" placeholder="自訂名稱" maxlength="30">
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>開始日期</label>
          <input id="phase-start" type="date">
        </div>
        <div class="form-field">
          <label>結束日期</label>
          <input id="phase-end" type="date">
        </div>
      </div>
      <button class="add-btn" onclick="addPhase()">新增</button>
    </div>
  </div>

  <div id="sch-links-section">
    <div class="popup-divider"></div>
    <div class="popup-section">連結</div>
    <div id="links-display-mode"></div>
    <div id="links-edit-mode" style="display:none">
      <div class="link-field"><label>會議連結</label><input id="link-meeting" type="url" placeholder="https://…"></div>
      <div class="link-field"><label>討論板</label><input id="link-discussion" type="url" placeholder="https://…"></div>
      <div class="link-field"><label>Brief</label><input id="link-brief" type="url" placeholder="https://…"></div>
      <button class="save-btn" onclick="saveLinks()">儲存連結</button>
      <button class="popup-close" onclick="showLinksDisplay()">取消</button>
    </div>
  </div>

  <div id="sch-note-section" style="display:none">
    <div class="popup-divider"></div>
    <div class="popup-section">備註</div>
    <textarea id="sch-note-input" class="note-textarea" placeholder="記錄截止相關備註…" onblur="saveNote()"></textarea>
  </div>

  <button class="popup-close" onclick="closePopup()">關閉</button>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>Project Timeline</h1>
  <div class="sep"></div>
  <span class="grp-label">顯示：</span>
  <button class="btn active" id="f-week"   onclick="setFilter('week')">本週</button>
  <button class="btn"        id="f-biweek" onclick="setFilter('biweek')">雙週</button>
  <button class="btn"        id="f-all"    onclick="setFilter('all')">全部</button>
  <div class="sep"></div>
  <span class="grp-label">縮放：</span>
  <button class="btn"        id="z-sm" onclick="setDayPx(48)">小</button>
  <button class="btn active" id="z-md" onclick="setDayPx(64)">中</button>
  <button class="btn"        id="z-lg" onclick="setDayPx(88)">大</button>
  <div class="sep"></div>
  <span class="grp-label">設計師：</span>
  <select id="designer-filter" onchange="setDesignerFilter(this.value)"
    style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;max-width:130px;">
    <option value="">全部</option>
  </select>
  <div class="sep"></div>
  <button class="btn active" id="hide-done-btn" onclick="toggleHideCompleted()">已完成已隱藏</button>
  <div class="sep"></div>
  <button class="btn" onclick="scrollToToday()">今天</button>
  <button class="btn" onclick="loadData()">重新整理</button>
  <span id="status-msg"></span>
</div>

<!-- Timeline -->
<div id="main-scroll">
  <div id="content-wrap">
    <div id="date-hdr"></div>
    <div id="rows-wrap"></div>
  </div>
</div>

<div id="drag-ghost"></div>

<script>
// ── Config ──────────────────────────────────────────────────────
const SUPABASE  = 'https://lczpbtkoxsvlsucbqoxp.supabase.co';
const ANON_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjenBidGtveHN2bHN1Y2Jxb3hwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMDgzNzUsImV4cCI6MjA5NDY4NDM3NX0.KtA-AwVW2ecHajexiKsiM-ZKLgG3wC8pcpq4vPp3SHw';
const NOTION_FN = `${SUPABASE}/functions/v1/get-timeline`;
const START_DATE = '2026-06-08';

// Type → hex color
const TYPE_COLOR = {
  KV:             '#FF6584',  // Board pink
  Moodboard:      '#FF6584',  // Board pink
  Presentation:   '#666666',  // Board gray
  V1:             '#666666',  // Board gray
  Revision:       '#666666',  // Board gray
  JPG:            '#E8914A',  // muted orange
  M1:             '#2A9D8F',  // Board teal
  'Revised Maker':'#2A9D8F',  // Board teal
};
function typeColor(t) { return TYPE_COLOR[t] || '#707888'; }
function hexRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

const PHASE_OPTS = ['討論','3D草稿/2D包現有型體','草稿/彩稿','合成','微調','上版/完成','找資料'];
// Types that show deadline chip instead of phase tracking
const DEADLINE_TYPES = new Set(['Revision','M1','Revised Maker']);

// Market groups (left-side fixed categories)
const MARKET_GROUPS = [
  { label: 'AP / INT',    markets: new Set(['AP','INT','HK','INT Other']) },
  { label: 'GC',          markets: new Set(['GC','GC Roastery']) },
  { label: 'SBJ',         markets: new Set(['SBJ','SBJ Roastery']) },
  { label: 'SCK',         markets: new Set(['SCK']) },
  { label: 'EMEA / MENA', markets: new Set(['EMEA','MENA','Milano Roastery']) },
  { label: 'TW',          markets: new Set(['TW']) },
  { label: 'RNA',         markets: new Set(['RNA']) },
  { label: 'Other',       markets: new Set(['Other']) },
];
function getMarketGroup(market) {
  for (const g of MARKET_GROUPS) { if (g.markets.has(market)) return g.label; }
  return 'Other';
}

// Type sort order within each market group
const TYPE_ORDER = ['KV','Moodboard','Presentation','V1','Revision','M1','Revised Maker'];
function typeSort(a, b) {
  const ai = TYPE_ORDER.indexOf(a.mainType);
  const bi = TYPE_ORDER.indexOf(b.mainType);
  return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
}

// ── State ────────────────────────────────────────────────────────
let allCases    = [];
let notionMap   = {};
let progressMap = {};
let phasesMap   = {};
let filterMode    = 'week';
let filterDesigner= '';     // '' = all designers
let hideCompleted = true;   // hide 已完成 cases by default
let dayPx         = 64;
let tlMinDate   = null;
let tlTotalDays = 0;

let currentProj = null;   // project name currently open in popup
let currentType = null;   // job type currently open in popup

const H = { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` };

// ── Data loading ──────────────────────────────────────────────────
async function loadData() {
  document.getElementById('loading').style.display = 'flex';
  try {
    const [cR, prR, phR, nR] = await Promise.all([
      fetch(`${SUPABASE}/rest/v1/cases?select=*&order=date.asc&date=gte.${START_DATE}&notion_project=not.is.null`, {headers:H}),
      fetch(`${SUPABASE}/rest/v1/project_progress?select=*`, {headers:H}),
      fetch(`${SUPABASE}/rest/v1/project_phases?select=*&order=start_date.asc`, {headers:H}),
      fetch(NOTION_FN, {headers:H}).catch(()=>null),
    ]);
    allCases = await cR.json().catch(()=>[]); if (!Array.isArray(allCases)) allCases=[];
    const prs = await prR.json().catch(()=>[]); progressMap={};
    for (const r of (prs||[])) progressMap[r.project_name]=r;
    const phs = await phR.json().catch(()=>[]); phasesMap={};
    for (const r of (phs||[])) { if (!phasesMap[r.project_name]) phasesMap[r.project_name]=[]; phasesMap[r.project_name].push(r); }
    notionMap={};
    if (nR?.ok) { const {items=[]}=await nR.json().catch(()=>({})); for (const it of items) if(it.name&&it.url) notionMap[it.name.trim()]=it.url; }
    populateDesignerFilter();
    buildTimeline();
    const ps=new Set(allCases.map(c=>c.notion_project));
    showMsg(`${allCases.length} 筆派案 · ${ps.size} 個專案`);
  } catch(e) { showMsg('載入失敗：'+e.message); }
  document.getElementById('loading').style.display='none';
}

// ── Filter: which projects to show ───────────────────────────────
function getFilteredProjects() {
  const today=new Date(); today.setHours(0,0,0,0);
  const todayMs=today.getTime();
  const dow=today.getDay();
  const weekMon=new Date(today); weekMon.setDate(today.getDate()-(dow===0?6:dow-1));
  const weekMonMs=weekMon.getTime();
  const weekSunMs=weekMonMs+7*86400000;
  const biweekEndMs=weekMonMs+14*86400000;

  // Aggregate by (project, type) — each type gets its own row
  const byKey={};
  for (const c of allCases) {
    if (hideCompleted && c.status==='已完成') continue;
    const t=(c.job_types?.[0])||'Other';
    const key=c.notion_project+'|||'+t;
    if (!byKey[key]) byKey[key]={proj:c.notion_project,type:t,cases:[]};
    byKey[key].cases.push(c);
  }

  // Compute per-row ranges first
  const rows=[];
  for (const {proj,type,cases} of Object.values(byKey)) {
    let minMs=Infinity, maxMs=-Infinity;
    for (const c of cases) {
      if (c.date)     minMs=Math.min(minMs,dateMs(c.date));
      if (c.deadline) maxMs=Math.max(maxMs,dateMs(c.deadline));
      else if (c.date) maxMs=Math.max(maxMs,dateMs(c.date));
    }
    if (!DEADLINE_TYPES.has(type)) {
      for (const ph of (phasesMap[proj]||[])) {
        if (ph.start_date) minMs=Math.min(minMs,dateMs(ph.start_date));
        if (ph.end_date)   maxMs=Math.max(maxMs,dateMs(ph.end_date));
      }
    }
    if (minMs===Infinity) continue;
    rows.push({proj,type,cases,minMs,maxMs,market:cases[0].market||'Other'});
  }

  // Determine which projects have ANY row in the time window (project-level filter)
  const visibleProjects=new Set();
  for (const {proj,minMs,maxMs} of rows) {
    let inc=false;
    if      (filterMode==='all')    inc=true;
    else if (filterMode==='week')   inc=minMs<weekSunMs&&maxMs>=weekMonMs;
    else if (filterMode==='biweek') inc=minMs<biweekEndMs&&maxMs>=weekMonMs;
    if (inc) visibleProjects.add(proj);
  }

  // Include ALL type-rows for visible projects
  const result=[];
  for (const {proj,type,cases,minMs,maxMs,market} of rows) {
    if (!visibleProjects.has(proj)) continue;
    // Designer filter
    if (filterDesigner) {
      const hasDesigner=cases.some(c=>(Array.isArray(c.designers)?c.designers:[]).includes(filterDesigner));
      if (!hasDesigner) continue;
    }
    result.push({proj,cases,minMs,maxMs,mainType:type,market});
  }
  return result;
}

// ── Build timeline ────────────────────────────────────────────────
function buildTimeline() {
  const projs=getFilteredProjects();
  const rw=document.getElementById('rows-wrap');
  const dh=document.getElementById('date-hdr');

  if (!projs.length) {
    dh.innerHTML=''; rw.innerHTML='';
    rw.innerHTML='<div style="padding:32px 24px;font-size:12px;color:var(--text-dim);text-align:center;">此時間範圍內無進行中專案</div>';
    return;
  }

  const today=new Date(); today.setHours(0,0,0,0);
  const todayMs=today.getTime();

  // Date range
  let minMs=Math.min(...projs.map(p=>p.minMs));
  let maxMs=Math.max(...projs.map(p=>p.maxMs));
  const minDate=new Date(minMs); minDate.setDate(minDate.getDate()-4);
  const maxDate=new Date(maxMs); maxDate.setDate(maxDate.getDate()+10);
  tlMinDate=minDate;
  tlTotalDays=Math.ceil((maxDate-minDate)/86400000)+1;
  const totalW=tlTotalDays*dayPx;

  document.getElementById('content-wrap').style.width=totalW+'px';

  // Date header
  renderDateHeader(minDate, totalW);

  // Group by market, sort each group by type
  const grouped = {};
  for (const p of projs) {
    const grp = getMarketGroup(p.market);
    if (!grouped[grp]) grouped[grp] = [];
    grouped[grp].push(p);
  }

  rw.innerHTML='';
  let rowIdx = 0;
  for (const g of MARKET_GROUPS) {
    const items = grouped[g.label];
    if (!items || !items.length) continue;
    items.sort(typeSort);
    // Group header row
    const hdr = mk('div','market-group-hdr');
    hdr.style.width = totalW + 'px';
    const lbl = mk('span','mkt-lbl');
    lbl.textContent = g.label;
    hdr.appendChild(lbl);
    rw.appendChild(hdr);
    // Group by project (keep type-sort order within each project)
    const projGroups={};
    const projOrder=[];
    for (const p of items) {
      if (!projGroups[p.proj]) { projGroups[p.proj]=[]; projOrder.push(p.proj); }
      projGroups[p.proj].push(p);
    }
    // Project rows (multi-type projects share one row)
    for (const projName of projOrder) {
      const pItems=projGroups[projName];
      const row=pItems.length===1
        ? buildRow(pItems[0], minDate, today, todayMs)
        : buildMultiRow(pItems, minDate, today, todayMs);
      rowIdx++;
      rw.appendChild(row);
    }
  }

  setTimeout(scrollToToday, 50);
}

// ── Date header ───────────────────────────────────────────────────
function renderDateHeader(minDate, totalW) {
  const hdr=document.getElementById('date-hdr');
  hdr.innerHTML='';
  hdr.style.width=totalW+'px';
  const today=new Date(); today.setHours(0,0,0,0);
  let d=new Date(minDate);
  for (let i=0;i<tlTotalDays;i++) {
    const cell=mk('div','day-cell');
    cell.style.width=dayPx+'px';
    const dow=d.getDay();
    const isTod=sameDay(d,today);
    if (dow===1) cell.classList.add('mon');
    if (!isTod&&(dow===0||dow===6)) cell.classList.add('weekend');
    if (isTod) cell.classList.add('today');
    const DOWS=['日','一','二','三','四','五','六'];
    const ds=mk('span','day-date'); ds.textContent=`${d.getMonth()+1}/${d.getDate()}`;
    const dw=mk('span','day-dow');  dw.textContent=DOWS[dow];
    cell.append(ds,dw);
    if (isTod) { const dot=mk('div','today-dot'); cell.appendChild(dot); }
    hdr.appendChild(cell);
    d.setDate(d.getDate()+1);
  }
}

// ── Build one project row ─────────────────────────────────────────
// Shared: add grid lines + today line to an existing row div
function addGridToRow(row, minDate, today) {
  let d=new Date(minDate);
  for (let i=0;i<tlTotalDays;i++) {
    const dow=d.getDay();
    if (dow===0||dow===6) {
      const wk=mk('div');
      wk.style.cssText=`position:absolute;left:${i*dayPx}px;top:0;width:${dayPx}px;height:100%;background:rgba(0,0,0,.032);pointer-events:none;z-index:0;`;
      row.appendChild(wk);
    }
    const gl=mk('div','grid-line');
    if (dow===1) gl.classList.add('mon');
    gl.style.left=(i*dayPx)+'px';
    row.appendChild(gl);
    d.setDate(d.getDate()+1);
  }
  const tOff=daysBetween(minDate,today);
  if (tOff>=0&&tOff<tlTotalDays) {
    const tl=mk('div','today-line');
    tl.style.left=(tOff*dayPx+dayPx/2-1)+'px';
    row.appendChild(tl);
  }
}

// Single-type row (backward compat)
function buildRow(p, minDate, today, todayMs) {
  const row=mk('div','proj-row');
  addGridToRow(row, minDate, today);
  const bar=buildBarEl(p, minDate, today, todayMs, 7);
  row.appendChild(bar);
  return row;
}

// Multi-type row: greedy lane-packing
// Non-overlapping bars share the same lane (same Y) → row height unchanged
// Overlapping bars get separate lanes (stacked) → row height increases
function buildMultiRow(items, minDate, today, todayMs) {
  const PAD=7;
  const slotH=t=>DEADLINE_TYPES.has(t)?44:84; // 30+7*2 or 30+40+7*2

  // Greedy lane assignment: assign each item to the first lane
  // where the previous item's range ends before this one starts
  const laneEnds=[]; // last maxMs per lane
  const itemLane=new Map();
  for (const p of items) {
    let placed=false;
    for (let li=0;li<laneEnds.length;li++) {
      if (p.minMs>=laneEnds[li]) {
        laneEnds[li]=p.maxMs;
        itemLane.set(p,li);
        placed=true; break;
      }
    }
    if (!placed) { laneEnds.push(p.maxMs); itemLane.set(p,laneEnds.length-1); }
  }

  // Per-lane height = max slotH of items in that lane
  const laneH=new Array(laneEnds.length).fill(0);
  for (const p of items) laneH[itemLane.get(p)]=Math.max(laneH[itemLane.get(p)],slotH(p.mainType));

  // Cumulative lane Y positions
  const laneY=[]; let y=0;
  for (const h of laneH) { laneY.push(y); y+=h; }
  const totalH=y;

  const row=mk('div','proj-row');
  row.style.height=totalH+'px';
  addGridToRow(row,minDate,today);
  for (const p of items) {
    const bar=buildBarEl(p,minDate,today,todayMs,laneY[itemLane.get(p)]+PAD);
    row.appendChild(bar);
  }
  return row;
}

// Build just the bar element (no row wrapper)
function buildBarEl({proj, cases, minMs, maxMs, mainType}, minDate, today, todayMs, topOffset) {
  const tc=typeColor(mainType);
  const rgb=hexRgb(tc);

  // Phases sorted
  const phases=(phasesMap[proj]||[]).slice().sort((a,b)=>dateMs(a.start_date)-dateMs(b.start_date));

  // Bar range: encompass cases + phases
  let barMinMs=minMs, barMaxMs=maxMs;
  if (phases.length) {
    barMinMs=Math.min(barMinMs,...phases.map(p=>dateMs(p.start_date)));
    barMaxMs=Math.max(barMaxMs,...phases.map(p=>p.end_date?dateMs(p.end_date):todayMs));
  }

  const barStartDay=daysBetween(minDate,new Date(barMinMs));
  const barEndDay=daysBetween(minDate,new Date(barMaxMs))+1;
  const barX=barStartDay*dayPx;
  const barW=Math.max(dayPx*2,(barEndDay-barStartDay)*dayPx);

  const bar=mk('div','proj-bar');
  bar.style.left=barX+'px';
  bar.style.width=barW+'px';
  bar.style.top=topOffset+'px';

  // Determine type early — controls bar structure
  const isDeadlineType = DEADLINE_TYPES.has(mainType);

  // ── Name header band ──
  const designers=[...new Set(cases.flatMap(c=>Array.isArray(c.designers)?c.designers:[]))].join(', ');
  const header=mk('div','bar-header');
  header.style.background=tc;
  header.title=`${proj} · ${mainType}${designers?' · '+designers:''}`;
  const nm=mk('span','bar-hdr-name'); nm.textContent=proj;
  const ty=mk('span','bar-hdr-type'); ty.textContent=`· ${mainType}`;
  // Revision / Revised Maker: amber type text to distinguish from other gray bars
  if (mainType==='Revision'||mainType==='Revised Maker') ty.style.color='#FFD580';
  header.append(nm,ty);
  if (designers) {
    const ds=mk('span','bar-hdr-type'); ds.textContent=`· ${designers}`;
    header.appendChild(ds);
  }
  // Notion link: only for non-deadline types (deadline bars show chip there instead)
  if (notionMap[proj] && !isDeadlineType) {
    const a=mk('a','bar-hdr-link');
    a.href=notionMap[proj]; a.target='_blank'; a.rel='noopener noreferrer';
    a.textContent='↗'; a.title='Notion';
    a.onclick=e=>e.stopPropagation();
    header.appendChild(a);
  }
  header.addEventListener('click', e=>{e.stopPropagation(); openScheduler(proj, mainType);});
  bar.appendChild(header);

  // ── Deadline type: header band only, no phase band, no chip ──
  if (isDeadlineType) {
    bar.style.height = 'var(--hdr-band)';
    return bar;
  }

  // ── Phase band (non-deadline types only) ──
  const band=mk('div','bar-phases');
  band.style.background=`rgba(${rgb},.08)`;

  if (phases.length) {
    for (let i=0;i<phases.length;i++) {
      const ph=phases[i];
      const phStartMs=dateMs(ph.start_date);
      const phEndMs=ph.end_date?dateMs(ph.end_date)+86400000:todayMs+86400000;
      const segLeft=Math.max(0,Math.round((phStartMs-barMinMs)/86400000))*dayPx;
      const segW=Math.max(dayPx*0.5,Math.round((phEndMs-phStartMs)/86400000)*dayPx);

      const isPast=phEndMs<=todayMs;
      const isCurr=phStartMs<=todayMs&&phEndMs>todayMs;

      const seg=mk('div','phase-seg');
      seg.dataset.id=ph.id;
      seg.dataset.proj=proj;
      seg.style.left=segLeft+'px';
      seg.style.width=segW+'px';
      if (isPast) {
        seg.classList.add('past');
      } else {
        seg.style.background=`rgba(${rgb},${isCurr?.28:.16})`;
        seg.style.color=tc;
        if (isCurr) seg.classList.add('current');
      }

      const lbl=mk('span','seg-label');
      lbl.textContent=ph.phase;
      if (segW<50) lbl.style.fontSize='8px';
      seg.appendChild(lbl);

      // Resize handle (right 6px)
      const rh=mk('div','resize-handle');
      seg.appendChild(rh);

      // Events
      seg.addEventListener('mouseenter',()=>{ if (!dragging) seg.style.cursor='grab'; });
      seg.addEventListener('mousemove', e=>{
        if (dragging) return;
        const rect=seg.getBoundingClientRect();
        seg.style.cursor=(rect.right-e.clientX<=8)?'ew-resize':'grab';
      });
      seg.addEventListener('mousedown', e=>{
        e.stopPropagation(); e.preventDefault();
        const rect=seg.getBoundingClientRect();
        if (rect.right-e.clientX<=8) startResize(e,ph,proj,bar,barMinMs,seg);
        else startMove(e,ph,proj,bar,barMinMs,seg);
      });
      seg.addEventListener('click',e=>{
        if (didDrag) return;
        e.stopPropagation();
        openScheduler(proj, mainType);
      });

      band.appendChild(seg);
    }
  } else {
    const empty=mk('div','bar-empty');
    empty.style.background=`rgba(${rgb},.06)`;
    empty.style.cursor='crosshair';
    band.appendChild(empty);
  }

  // Drag on band background or empty div to create phase; plain click opens popup
  band.addEventListener('mousedown', e=>{
    const isValidTarget=e.target===band||e.target.classList.contains('bar-empty');
    if (!isValidTarget) return;
    e.preventDefault();
    startCreate(e, proj, band, barMinMs);
  });
  band.addEventListener('click', e=>{
    const isValidTarget=e.target===band||e.target.classList.contains('bar-empty');
    if (!isValidTarget||didDrag) return;
    e.stopPropagation();
    openScheduler(proj, mainType);
  });

  bar.appendChild(band);
  return bar;
}

// ── Drag state ────────────────────────────────────────────────────
let dragging=false, didDrag=false;
let dragCleanup=null;

function startCreate(e, proj, band, barMinMs) {
  dragging=true; didDrag=false;
  const bandRect=band.getBoundingClientRect();
  const startRelX=e.clientX-bandRect.left;
  const startDay=Math.floor(startRelX/dayPx);

  const ghost=document.getElementById('drag-ghost');
  ghost.style.display='block';
  ghost.style.top=bandRect.top+'px';
  ghost.style.height=bandRect.height+'px';
  updateGhost(ghost, bandRect.left+startDay*dayPx, dayPx);

  let curDay=startDay;

  function onMove(ev) {
    didDrag=true;
    const rect=band.getBoundingClientRect();
    const relX=ev.clientX-rect.left;
    curDay=Math.floor(relX/dayPx);
    const left=rect.left+Math.min(startDay,curDay)*dayPx;
    const w=(Math.abs(curDay-startDay)+1)*dayPx;
    ghost.style.top=rect.top+'px';
    ghost.style.height=rect.height+'px';
    updateGhost(ghost,left,w);
  }

  function onUp(ev) {
    cleanup();
    if (!didDrag) return; // band's own click listener handles the popup
    const s=Math.min(startDay,curDay), en=Math.max(startDay,curDay);
    const sd=addDays(barMinMs,s), ed=addDays(barMinMs,en);
    openScheduler(proj, mainType, {startDate:sd,endDate:ed});
  }

  function cleanup() {
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    ghost.style.display='none';
    dragging=false;
  }
  dragCleanup=cleanup;
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function startMove(e, ph, proj, bar, barMinMs, seg) {
  dragging=true; didDrag=false;
  const startX=e.clientX;
  const origLeft=parseFloat(seg.style.left);
  const origStartMs=dateMs(ph.start_date);
  const origEndMs=ph.end_date?dateMs(ph.end_date):origStartMs;

  seg.style.opacity='.65';
  document.body.style.cursor='grabbing';

  function onMove(ev) {
    didDrag=true;
    const dx=ev.clientX-startX;
    seg.style.left=Math.max(0,origLeft+dx)+'px';
  }
  function onUp(ev) {
    cleanup();
    const daysDelta=Math.round((ev.clientX-startX)/dayPx);
    seg.style.left=origLeft+'px';
    if (!didDrag||daysDelta===0) return;
    const newStart=new Date(origStartMs+daysDelta*86400000).toISOString().slice(0,10);
    const newEnd=new Date(origEndMs+daysDelta*86400000).toISOString().slice(0,10);
    updatePhase(ph.id,proj,{start_date:newStart,end_date:newEnd});
  }
  function cleanup() {
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    seg.style.opacity='';
    document.body.style.cursor='';
    dragging=false;
  }
  dragCleanup=cleanup;
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function startResize(e, ph, proj, bar, barMinMs, seg) {
  dragging=true; didDrag=false;
  const startX=e.clientX;
  const origW=parseFloat(seg.style.width);
  const origEndMs=ph.end_date?dateMs(ph.end_date):dateMs(ph.start_date);

  document.body.style.cursor='ew-resize';

  function onMove(ev) {
    didDrag=true;
    const dx=ev.clientX-startX;
    seg.style.width=Math.max(dayPx*0.5,origW+dx)+'px';
  }
  function onUp(ev) {
    cleanup();
    const daysDelta=Math.round((ev.clientX-startX)/dayPx);
    seg.style.width=origW+'px';
    if (!didDrag||daysDelta===0) return;
    const newEnd=new Date(origEndMs+daysDelta*86400000).toISOString().slice(0,10);
    updatePhase(ph.id,proj,{end_date:newEnd});
  }
  function cleanup() {
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    document.body.style.cursor='';
    dragging=false;
  }
  dragCleanup=cleanup;
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function updateGhost(ghost, left, w) {
  ghost.style.left=left+'px';
  ghost.style.width=w+'px';
}

// ── Phase CRUD ────────────────────────────────────────────────────
async function updatePhase(id, proj, fields) {
  try {
    const res=await fetch(`${SUPABASE}/rest/v1/project_phases?id=eq.${id}`,{
      method:'PATCH',
      headers:{...H,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(fields),
    });
    if (res.ok||res.status===204) {
      if (phasesMap[proj]) { const i=phasesMap[proj].findIndex(p=>p.id===id); if(i>=0) Object.assign(phasesMap[proj][i],fields); }
      showMsg('✓ 已更新'); buildTimeline(); if(currentProj===proj) rerenderPopup();
    } else showMsg('✗ 更新失敗');
  } catch { showMsg('✗ 更新失敗'); }
}

async function addPhase() {
  if (!currentProj) return;
  const sel=document.getElementById('phase-name-select').value;
  const name=sel==='__custom__'?document.getElementById('custom-phase-text').value.trim():sel;
  const start=document.getElementById('phase-start').value;
  const end=document.getElementById('phase-end').value;
  if (!name||!start) { showMsg('請填寫名稱和開始日期'); return; }
  try {
    const body={project_name:currentProj,phase:name,start_date:start,end_date:end||null};
    const res=await fetch(`${SUPABASE}/rest/v1/project_phases`,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify(body),
    });
    if (res.ok||res.status===201) {
      const data=await res.json();
      if (!phasesMap[currentProj]) phasesMap[currentProj]=[];
      phasesMap[currentProj].push(Array.isArray(data)?data[0]:data||body);
      document.getElementById('add-phase-form').classList.remove('open');
      document.getElementById('add-phase-toggle').textContent='＋ 新增時程';
      renderPhaseList(currentProj); showMsg('✓ 已新增'); buildTimeline();
    } else showMsg('✗ 新增失敗');
  } catch { showMsg('✗ 新增失敗'); }
}

async function deletePhase(id, proj) {
  if (!confirm('確定刪除這個時程？')) return;
  try {
    const res=await fetch(`${SUPABASE}/rest/v1/project_phases?id=eq.${id}`,{
      method:'DELETE', headers:{...H,'Prefer':'return=minimal'},
    });
    if (res.ok||res.status===204) {
      if (phasesMap[proj]) phasesMap[proj]=phasesMap[proj].filter(p=>p.id!==id);
      renderPhaseList(proj); showMsg('✓ 已刪除'); buildTimeline();
    } else showMsg('✗ 刪除失敗');
  } catch { showMsg('✗ 刪除失敗'); }
}

function reorderPhase(proj, idx, dir) {
  const phases=(phasesMap[proj]||[]).slice().sort((a,b)=>dateMs(a.start_date)-dateMs(b.start_date));
  const ni=idx+dir;
  if (ni<0||ni>=phases.length) return;
  const a=phases[idx], b=phases[ni];
  const tS=a.start_date, tE=a.end_date;
  a.start_date=b.start_date; a.end_date=b.end_date;
  b.start_date=tS; b.end_date=tE;
  const hdrs={...H,'Content-Type':'application/json','Prefer':'return=minimal'};
  Promise.all([
    fetch(`${SUPABASE}/rest/v1/project_phases?id=eq.${a.id}`,{method:'PATCH',headers:hdrs,body:JSON.stringify({start_date:a.start_date,end_date:a.end_date})}),
    fetch(`${SUPABASE}/rest/v1/project_phases?id=eq.${b.id}`,{method:'PATCH',headers:hdrs,body:JSON.stringify({start_date:b.start_date,end_date:b.end_date})}),
  ]).then(()=>{buildTimeline();renderPhaseList(proj);});
}

// ── Popup ─────────────────────────────────────────────────────────
function openScheduler(proj, type, prefillDates) {
  currentProj=proj;
  currentType=type||'Other';
  const mt=currentType;
  const isDeadline=DEADLINE_TYPES.has(mt);
  // Filter to cases matching this specific type
  const cases=allCases.filter(c=>c.notion_project===proj&&(c.job_types?.[0]||'Other')===mt);

  document.getElementById('sch-title').textContent=proj;
  document.getElementById('sch-meta').textContent=mt+(cases.length>1?` · ${cases.length} 個派案`:'');

  // Designers row
  const designers=[...new Set(cases.flatMap(c=>Array.isArray(c.designers)?c.designers:[]))].join('  ·  ');
  const dRow=document.getElementById('sch-designers-row');
  dRow.textContent=designers;
  dRow.style.display=designers?'':'none';

  // Toggle sections based on type
  document.getElementById('sch-leader-section').style.display=isDeadline?'none':'';
  document.getElementById('sch-phase-section').style.display=isDeadline?'none':'';
  document.getElementById('sch-links-section').style.display=isDeadline?'none':'';
  document.getElementById('sch-note-section').style.display=isDeadline?'':'none';

  if (!isDeadline) {
    document.getElementById('leader-input').value=(progressMap[proj]?.project_leader)||'';
    renderPhaseList(proj);
  } else {
    document.getElementById('sch-note-input').value=(progressMap[proj]?.custom_label)||'';
  }

  if (!isDeadline) {
    // Reset add form
    const form=document.getElementById('add-phase-form');
    form.classList.remove('open');
    document.getElementById('add-phase-toggle').textContent='＋ 新增時程';
    document.getElementById('phase-name-select').value='討論';
    document.getElementById('custom-phase-input').style.display='none';
    document.getElementById('custom-phase-text').value='';

    if (prefillDates) {
      document.getElementById('phase-start').value=prefillDates.startDate;
      document.getElementById('phase-end').value=prefillDates.endDate;
      form.classList.add('open');
      document.getElementById('add-phase-toggle').textContent='收起';
    } else {
      const t=new Date().toISOString().slice(0,10);
      document.getElementById('phase-start').value=t;
      document.getElementById('phase-end').value=t;
    }

    renderLinksDisplay(proj);
  }

  const pop=document.getElementById('sch-popup');
  pop.style.top='80px';
  pop.style.left=Math.max(10,(window.innerWidth-370)/2)+'px';
  pop.classList.add('visible');
}

function rerenderPopup() { if (currentProj) renderPhaseList(currentProj); }
// Full reopen (used after phase edit to sync popup state)
function reopenPopup() { if (currentProj && currentType) openScheduler(currentProj, currentType); }

function renderPhaseList(proj) {
  const c=document.getElementById('sch-phases'); c.innerHTML='';
  const phases=(phasesMap[proj]||[]).slice().sort((a,b)=>dateMs(a.start_date)-dateMs(b.start_date));
  if (!phases.length) {
    const em=mk('div'); em.style.cssText='font-size:11px;color:var(--text-dim);margin-bottom:8px;';
    em.textContent='尚無時程規劃'; c.appendChild(em); return;
  }
  for (let i=0;i<phases.length;i++) c.appendChild(buildPhaseRow(phases[i],proj,i,phases.length));
}

function buildPhaseRow(ph, proj, idx, total) {
  const item=mk('div','phase-item');
  const today=new Date(); today.setHours(0,0,0,0);
  const endMs=ph.end_date?dateMs(ph.end_date):today.getTime();
  const isPast=endMs<today.getTime();

  const rbtns=mk('div','reorder-btns');
  const up=mk('button','reorder-btn'); up.textContent='▲'; up.title='上移';
  up.style.opacity=idx===0?'.25':'1';
  up.onclick=e=>{e.stopPropagation(); if(idx>0)reorderPhase(proj,idx,-1);};
  const dn=mk('button','reorder-btn'); dn.textContent='▼'; dn.title='下移';
  dn.style.opacity=idx===total-1?'.25':'1';
  dn.onclick=e=>{e.stopPropagation(); if(idx<total-1)reorderPhase(proj,idx,1);};
  rbtns.append(up,dn);

  const dot=mk('div','phase-dot');
  dot.style.background=isPast?'#bbb':typeColor((allCases.find(c=>c.notion_project===proj)?.job_types?.[0])||'Other');
  const dates=mk('span','phase-dates-lbl');
  dates.textContent=fmtDate(ph.start_date)+(ph.end_date?' → '+fmtDate(ph.end_date):' → 今天');
  const name=mk('span','phase-name-lbl'); name.textContent=ph.phase;
  const del=mk('button','phase-del'); del.textContent='×'; del.title='刪除';
  del.onclick=e=>{e.stopPropagation(); deletePhase(ph.id,proj);};
  item.append(rbtns,dot,dates,name,del);

  item.onclick=e=>{
    if(e.target===del||e.target===up||e.target===dn) return;
    item.innerHTML=''; item.style.cssText='';
    buildPhaseEditInline(item,ph,proj);
  };
  return item;
}

function buildPhaseEditInline(container, ph, proj) {
  const selWrap=mk('div'); selWrap.style.cssText='flex:1.2;min-width:0;';
  const sel=mk('select'); sel.style.cssText='width:100%;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-family:inherit;';
  for (const opt of PHASE_OPTS) {
    const o=mk('option'); o.value=opt; o.textContent=opt;
    if(opt===ph.phase) o.selected=true; sel.appendChild(o);
  }
  const co=mk('option'); co.value='__custom__'; co.textContent='自訂…';
  if (!PHASE_OPTS.includes(ph.phase)) co.selected=true; sel.appendChild(co);
  selWrap.appendChild(sel);
  const ci=mk('input'); ci.type='text'; ci.maxLength=30;
  ci.style.cssText='width:100%;padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-family:inherit;margin-top:3px;display:none;';
  if (!PHASE_OPTS.includes(ph.phase)) { ci.style.display='block'; ci.value=ph.phase; }
  sel.onchange=()=>{ ci.style.display=sel.value==='__custom__'?'block':'none'; };
  selWrap.appendChild(ci);

  const sIn=mk('input'); sIn.type='date'; sIn.value=ph.start_date||'';
  sIn.style.cssText='padding:3px 5px;border-radius:5px;border:1px solid var(--border);background:var(--bg);font-size:11px;font-family:inherit;width:112px;';
  const eIn=mk('input'); eIn.type='date'; eIn.value=ph.end_date||'';
  eIn.style.cssText=sIn.style.cssText;

  const saveB=mk('button'); saveB.textContent='✓';
  saveB.style.cssText='background:#1a1817;color:#fff;border:none;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:12px;';
  const cancelB=mk('button'); cancelB.textContent='✕';
  cancelB.style.cssText='background:none;border:1px solid var(--border);border-radius:5px;padding:3px 7px;cursor:pointer;font-size:11px;color:var(--text-dim);';

  const r1=mk('div'); r1.style.cssText='display:flex;gap:5px;width:100%;margin-bottom:5px;';
  const r2=mk('div'); r2.style.cssText='display:flex;gap:5px;align-items:center;width:100%;flex-wrap:wrap;';
  r1.appendChild(selWrap); r2.append(sIn,eIn,saveB,cancelB);
  container.style.cssText='flex-direction:column;background:var(--surface2);border-radius:7px;padding:7px 8px;cursor:default;gap:0;';
  container.append(r1,r2);

  cancelB.onclick=e=>{e.stopPropagation(); container.replaceWith(buildPhaseRow(ph,proj,0,1));};
  saveB.onclick=async e=>{
    e.stopPropagation();
    const nn=sel.value==='__custom__'?ci.value.trim():sel.value;
    if (!nn) return;
    await updatePhase(ph.id,proj,{phase:nn,start_date:sIn.value,end_date:eIn.value||null});
    renderPhaseList(proj);
  };
}

function toggleAddForm() {
  const f=document.getElementById('add-phase-form');
  const btn=document.getElementById('add-phase-toggle');
  const open=f.classList.toggle('open');
  btn.textContent=open?'收起':'＋ 新增時程';
}
function onPhaseNameChange() {
  const v=document.getElementById('phase-name-select').value;
  document.getElementById('custom-phase-input').style.display=v==='__custom__'?'block':'none';
}
function closePopup() {
  document.getElementById('sch-popup').classList.remove('visible');
  currentProj=null;
}
document.addEventListener('click',e=>{
  const p=document.getElementById('sch-popup');
  if (p.classList.contains('visible')&&!p.contains(e.target)) closePopup();
});

// ── Links ─────────────────────────────────────────────────────────
function renderLinksDisplay(proj) {
  const prog=progressMap[proj]||{};
  const links=[
    {label:'會議連結',val:prog.meeting_link||''},
    {label:'討論板',  val:prog.discussion_link||''},
    {label:'Brief',   val:prog.brief_link||''},
  ];
  const hasAny=links.some(l=>l.val);
  const disp=document.getElementById('links-display-mode'); disp.innerHTML='';
  for (const {label,val} of links) {
    const row=mk('div','link-row');
    const lbl=mk('span','link-lbl'); lbl.textContent=label;
    const v=mk('div','link-val'+(val?'':' empty'));
    if (val) {
      const a=mk('a'); a.href=val; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent=val.replace(/^https?:\/\//,'').slice(0,40)+(val.length>47?'…':'');
      a.onclick=e=>e.stopPropagation(); v.appendChild(a);
    } else v.textContent='—';
    row.append(lbl,v); disp.appendChild(row);
  }
  const btn=mk('button','link-edit-btn');
  btn.textContent=hasAny?'編輯連結':'新增連結';
  btn.onclick=()=>showLinksEdit(proj);
  disp.appendChild(btn);
  document.getElementById('links-display-mode').style.display='block';
  document.getElementById('links-edit-mode').style.display='none';
}
function showLinksDisplay() { renderLinksDisplay(currentProj); }
function showLinksEdit(proj) {
  const prog=progressMap[proj]||{};
  document.getElementById('link-meeting').value=prog.meeting_link||'';
  document.getElementById('link-discussion').value=prog.discussion_link||'';
  document.getElementById('link-brief').value=prog.brief_link||'';
  document.getElementById('links-display-mode').style.display='none';
  document.getElementById('links-edit-mode').style.display='block';
}
async function saveLinks() {
  if (!currentProj) return;
  const body={
    project_name:currentProj,
    meeting_link:document.getElementById('link-meeting').value.trim()||null,
    discussion_link:document.getElementById('link-discussion').value.trim()||null,
    brief_link:document.getElementById('link-brief').value.trim()||null,
    updated_at:new Date().toISOString(),
  };
  try {
    const res=await fetch(`${SUPABASE}/rest/v1/project_progress`,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(body),
    });
    if (res.ok||res.status===204||res.status===201) {
      if (!progressMap[currentProj]) progressMap[currentProj]={};
      Object.assign(progressMap[currentProj],body);
      showMsg('✓ 連結已儲存'); renderLinksDisplay(currentProj);
    } else showMsg('✗ 儲存失敗');
  } catch { showMsg('✗ 儲存失敗'); }
}

// ── Project Leader ────────────────────────────────────────────────
async function saveLeader() {
  if (!currentProj) return;
  const leader=document.getElementById('leader-input').value.trim();
  try {
    const res=await fetch(`${SUPABASE}/rest/v1/project_progress`,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({project_name:currentProj,project_leader:leader||null,updated_at:new Date().toISOString()}),
    });
    if (res.ok||res.status===204||res.status===201) {
      if (!progressMap[currentProj]) progressMap[currentProj]={};
      progressMap[currentProj].project_leader=leader||null;
      showMsg('✓ 已儲存');
    }
  } catch {}
}

// ── Deadline type note ────────────────────────────────────────────
async function saveNote() {
  if (!currentProj) return;
  const note=document.getElementById('sch-note-input').value.trim();
  try {
    const res=await fetch(`${SUPABASE}/rest/v1/project_progress`,{
      method:'POST',
      headers:{...H,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify({project_name:currentProj,custom_label:note||null,updated_at:new Date().toISOString()}),
    });
    if (res.ok||res.status===204||res.status===201) {
      if (!progressMap[currentProj]) progressMap[currentProj]={};
      progressMap[currentProj].custom_label=note||null;
      showMsg('✓ 備註已儲存');
    }
  } catch {}
}

// ── Controls ──────────────────────────────────────────────────────
function populateDesignerFilter() {
  const sel=document.getElementById('designer-filter');
  const current=sel.value;
  const designers=[...new Set(allCases.flatMap(c=>Array.isArray(c.designers)?c.designers:[]))].sort((a,b)=>a.localeCompare(b,'zh-TW'));
  // Keep "全部" option, rebuild the rest
  sel.innerHTML='<option value="">全部</option>';
  for (const d of designers) {
    const opt=document.createElement('option');
    opt.value=d; opt.textContent=d;
    if (d===current) opt.selected=true;
    sel.appendChild(opt);
  }
}
function setDesignerFilter(val) {
  filterDesigner=val;
  buildTimeline();
}
function toggleHideCompleted() {
  hideCompleted=!hideCompleted;
  const btn=document.getElementById('hide-done-btn');
  btn.textContent=hideCompleted?'已完成已隱藏':'顯示已完成';
  btn.classList.toggle('active', hideCompleted);
  buildTimeline();
}
function setFilter(mode) {
  filterMode=mode;
  document.querySelectorAll('.btn[id^="f-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+mode)?.classList.add('active');
  buildTimeline();
}
function setDayPx(px) {
  dayPx=px;
  const map={48:'z-sm',64:'z-md',88:'z-lg'};
  document.querySelectorAll('.btn[id^="z-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById(map[px])?.classList.add('active');
  buildTimeline();
}
function scrollToToday() {
  const ms=document.getElementById('main-scroll');
  if (!tlMinDate) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const offset=daysBetween(tlMinDate,today)*dayPx;
  ms.scrollLeft=Math.max(0,offset-ms.clientWidth/3);
}

// ── Utils ─────────────────────────────────────────────────────────
function dateMs(s) {
  if (!s) return 0;
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).getTime();
}
function addDays(baseMs, days) {
  return new Date(baseMs+days*86400000).toISOString().slice(0,10);
}
function daysBetween(a,b) {
  const am=a instanceof Date?new Date(a).setHours(0,0,0,0):dateMs(a);
  const bm=b instanceof Date?new Date(b).setHours(0,0,0,0):dateMs(b);
  return Math.round((bm-am)/86400000);
}
function sameDay(a,b) {
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}
function mk(tag,cls) { const e=document.createElement(tag); if(cls)e.className=cls; return e; }
function fmtDate(s) { if(!s) return ''; const [,m,d]=s.split('-'); return `${parseInt(m)}/${parseInt(d)}`; }
function showMsg(txt) {
  const el=document.getElementById('status-msg'); el.textContent=txt;
  setTimeout(()=>{ const ps=new Set(allCases.map(c=>c.notion_project)); el.textContent=`${allCases.length} 筆派案 · ${ps.size} 個專案`; }, 2500);
}

// ── Init ──────────────────────────────────────────────────────────
loadData();
window.addEventListener('resize',()=>buildTimeline());
